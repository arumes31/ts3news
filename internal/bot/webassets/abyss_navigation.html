{{define "abyss-navigation"}}
<script data-cfasync="false">
(function(){
  'use strict';
  var sectionGroups=[
    {key:'season',label:'🔥 Season'},
    {key:'progression',label:'🛠️ Progression'},
    {key:'observatory',label:'📡 Observatory'},
    {key:'shop',label:'🜲 Shop'},
    {key:'forge',label:'⚒️ Forge'},
    {key:'social',label:'🤝 Fellowship'},
    {key:'lore',label:'📖 Lore & Bestiary'},
    {key:'leaderboards',label:'🏆 Leaderboards'}
  ];
  function sectionPanels(group){return Array.prototype.slice.call(document.querySelectorAll('[data-abyss-section="'+group.key+'"]'));}
  function initialSection(groups){
    if(location.hash==='#lb'||location.search.indexOf('lbtier=')>=0)return 'leaderboards';
    if(location.hash.length>1){var hashKey=location.hash.slice(1).toLowerCase();if(groups.some(function(group){return group.key===hashKey;}))return hashKey;var linked=document.getElementById(location.hash.slice(1)),panel=linked&&linked.closest?linked.closest('[data-abyss-section]'):null;if(panel)return panel.getAttribute('data-abyss-section')||'';}
    try{var stored=localStorage.getItem('abyss_section_tab')||'',legacy=['progression','lore','leaderboards'];return /^\d+$/.test(stored)?(legacy[parseInt(stored,10)]||'progression'):stored;}catch(_){return 'progression';}
  }
  function buildAbyssTabs(){
    var groups=sectionGroups.map(function(group){return {key:group.key,label:group.label,els:sectionPanels(group)};}).filter(function(group){return group.els.length>0;});
    if(groups.length<2||document.querySelector('.ab-tabs'))return;
    var bar=document.createElement('div'),first=document.querySelector('.abyss-cols')||groups[0].els[0],initial=initialSection(groups);
    if(!groups.some(function(group){return group.key===initial;}))initial='progression';
    bar.className='ab-tabs';bar.setAttribute('aria-label','Abyss sections');bar.setAttribute('role','tablist');
    groups.forEach(function(group){group.els.forEach(function(panel,index){if(!panel.id)panel.id='abyss-section-'+group.key+'-'+index;panel.setAttribute('role','tabpanel');});});
    function revealTab(button){
      if(!button||bar.scrollWidth<=bar.clientWidth)return;
      var left=button.offsetLeft-(bar.clientWidth-button.offsetWidth)/2,reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      bar.scrollTo({left:Math.max(0,left),behavior:reduce?'auto':'smooth'});
    }
    groups.forEach(function(group){
      var button=document.createElement('button'),active=group.key===initial;
      button.type='button';button.id='abyss-tab-'+group.key;button.dataset.tabKey=group.key;button.className='ab-tab'+(active?' active':'');button.setAttribute('role','tab');button.setAttribute('aria-selected',active?'true':'false');button.tabIndex=active?0:-1;button.setAttribute('aria-controls',group.els.map(function(panel){return panel.id;}).join(' '));button.textContent=group.label;
      group.els.forEach(function(panel){panel.setAttribute('aria-labelledby',button.id);panel.hidden=!active;});
      button.onclick=function(){bar.querySelectorAll('[data-tab-key]').forEach(function(tab){tab.classList.remove('active');tab.setAttribute('aria-selected','false');tab.tabIndex=-1;});button.classList.add('active');button.setAttribute('aria-selected','true');button.tabIndex=0;groups.forEach(function(candidate){candidate.els.forEach(function(panel){panel.hidden=candidate.key!==group.key;});});revealTab(button);try{localStorage.setItem('abyss_section_tab',group.key);}catch(_){}};
      button.addEventListener('keydown',function(event){if(event.key!=='ArrowLeft'&&event.key!=='ArrowRight'&&event.key!=='Home'&&event.key!=='End')return;event.preventDefault();var tabs=Array.prototype.slice.call(bar.querySelectorAll('[data-tab-key]')),current=tabs.indexOf(button),next=current;if(event.key==='Home')next=0;else if(event.key==='End')next=tabs.length-1;else next=(current+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;tabs[next].focus();tabs[next].click();});
      bar.appendChild(button);
    });
    var skillWeb=document.createElement('button');skillWeb.className='ab-tab';skillWeb.type='button';skillWeb.setAttribute('role','tab');skillWeb.setAttribute('aria-selected','false');skillWeb.textContent='🌳 Skill Web';skillWeb.title='Every live node · six disciplines · opens the skill web';skillWeb.onclick=function(){window.location.href='/abyss/tree';};bar.appendChild(skillWeb);
    first.parentNode.insertBefore(bar,first);
    requestAnimationFrame(function(){revealTab(bar.querySelector('.ab-tab.active'));});
  }
  window.buildAbyssTabs=buildAbyssTabs;
  var aliases={season:'#abyssSeasonJourney',progression:'#abyssSetBonuses',observatory:'#abyssObservatory',shop:'#abyssTokenShop',forge:'#abyssForgePanel',workshop:'#abyssWorkshop',lore:'.abyss-lore-bestiary',bestiary:'.ab-bestiary-table',leaderboards:'#lb'};
  function targetForHash(){var key=location.hash.slice(1).toLowerCase();if(key==='talents'){location.assign('/abyss/tree#talents');return null;}var selector=aliases[key]||location.hash;if(!selector)return null;try{return document.querySelector(selector);}catch(_){return null;}}
  function activateDeepLink(){var target=targetForHash();if(!target)return;var panel=target.closest?target.closest('[data-abyss-section]'):null,key=panel&&panel.dataset.abyssSection,tab=key&&document.querySelector('.ab-tab[data-tab-key="'+key+'"]'),collapsible=target.closest?target.closest('.ab-nav-collapsible'):null;if(tab&&!tab.classList.contains('active'))tab.click();if(collapsible){var collapseButton=collapsible.querySelector('.ab-panel-collapse');collapsible.classList.remove('ab-panel-collapsed');if(collapseButton){collapseButton.setAttribute('aria-expanded','true');collapseButton.textContent=collapseButton.textContent.replace(/^Expand/,'Collapse');}try{localStorage.setItem(collapsible.dataset.collapseKey,'1');}catch(_){}}setTimeout(function(){target.scrollIntoView({block:'start',behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});},0);}
  function persistTabs(){document.querySelectorAll('.ab-tab[data-tab-key]').forEach(function(tab){tab.addEventListener('click',function(){var key=tab.dataset.tabKey,current=location.hash.slice(1).toLowerCase();try{localStorage.setItem('abyss_section_tab',key);}catch(_){}if(current!==key){try{history.replaceState(null,'','#'+key);}catch(_){}}});});}
  function panelCount(panel){if(panel.querySelector('.ab-bestiary-table'))return panel.querySelectorAll('.ab-bestiary-table tbody tr:not(.ab-best-fam)').length;if(panel.querySelector('.ab-codex-grid'))return panel.querySelectorAll('.ab-codex-item').length;if(panel.id==='abyssRunHistory')return panel.querySelectorAll('.ab-history tbody tr:not(.ab-hist-detail)').length;return panel.querySelectorAll(':scope > div, :scope > ul > li, :scope > table tbody tr').length;}
  function initCollapsiblePanels(){document.querySelectorAll('.abyss-lore-bestiary > .abyss-panel, #abyssRunHistory').forEach(function(panel,index){var heading=panel.querySelector('h2');if(!heading)return;panel.classList.add('ab-nav-collapsible');var count=panelCount(panel),key='ab_panel_open_'+(panel.id||'library_'+index),stored=null;panel.dataset.collapseKey=key;try{stored=localStorage.getItem(key);}catch(_){}var open=stored===null?!panel.querySelector('.ab-bestiary-table'):stored==='1',button=document.createElement('button');button.type='button';button.className='ghost xs ab-panel-collapse';button.setAttribute('aria-expanded',open?'true':'false');button.textContent=(open?'Collapse':'Expand')+' · '+count;button.addEventListener('click',function(){open=!open;panel.classList.toggle('ab-panel-collapsed',!open);button.setAttribute('aria-expanded',open?'true':'false');button.textContent=(open?'Collapse':'Expand')+' · '+count;try{localStorage.setItem(key,open?'1':'0');}catch(_){}});heading.appendChild(button);panel.classList.toggle('ab-panel-collapsed',!open);});}
  function initLibrarySearch(){var library=document.querySelector('.abyss-lore-bestiary');if(!library)return;var tools=document.createElement('div'),input=document.createElement('input'),status=document.createElement('span');tools.className='ab-library-tools';input.id='abyssLibrarySearch';input.type='search';input.className='ab-select';input.placeholder='Search lore and bestiary…';input.setAttribute('aria-label','Search lore fragments and bestiary');status.className='ab-library-results';status.setAttribute('role','status');tools.append(input,status);library.insertBefore(tools,library.firstChild);input.addEventListener('input',function(){var query=input.value.trim().toLowerCase(),shown=0;library.querySelectorAll('.ab-codex-item, .ab-bestiary-table tbody tr:not(.ab-best-fam)').forEach(function(row){if(query&&row.dataset.navDisplay===undefined)row.dataset.navDisplay=row.style.display||'';var match=!query||(row.textContent||'').toLowerCase().indexOf(query)>=0;row.hidden=!match;if(query)row.style.display=match?'':'none';else if(row.dataset.navDisplay!==undefined){row.style.display=row.dataset.navDisplay;delete row.dataset.navDisplay;}if(match)shown++;});library.querySelectorAll('.ab-best-fam').forEach(function(row){row.hidden=!!query;});library.querySelectorAll('.ab-nav-collapsible').forEach(function(panel){var button=panel.querySelector('.ab-panel-collapse');panel.classList.toggle('ab-panel-collapsed',!query&&button&&button.getAttribute('aria-expanded')==='false');});status.textContent=query?shown+' matches':'';});}
  function initOverflow(){var record=document.getElementById('abyssRecord');if(!record)return;var actions=[],preview=record.querySelector('#prestigePreview'),prestige=record.querySelector('button[onclick*="abyssPrestige"]'),badge=record.querySelector('.ab-badge-picker');if(preview)actions.push(preview);if(prestige)actions.push(prestige);if(badge)actions.push(badge);if(!actions.length)return;var details=document.createElement('details'),summary=document.createElement('summary'),body=document.createElement('div');details.className='ab-overflow';details.id='abyssRareActions';summary.textContent='⋯ Rare account actions';body.className='ab-overflow-body';actions.forEach(function(action){body.appendChild(action);});details.append(summary,body);record.appendChild(details);}
  function compactNumber(value){value=Math.max(0,Number(value)||0);if(value>=1e9)return(value/1e9).toFixed(1).replace(/\.0$/,'')+'b';if(value>=1e6)return(value/1e6).toFixed(1).replace(/\.0$/,'')+'m';if(value>=1e3)return(value/1e3).toFixed(1).replace(/\.0$/,'')+'k';return String(Math.round(value));}
  function updateAbyssTitle(){var title=inRun?'Abyss · F'+curDepth+' · '+compactNumber(curEscrow)+' escrow':'Abyss · Best F'+Number((document.getElementById('bestDepth')||{}).textContent&&String(document.getElementById('bestDepth').textContent).replace(/\D/g,'')||0);document.title=title;if(typeof abOrigTitle!=='undefined')abOrigTitle=title;}
  function wrapTitleSetter(name){var original=window[name];if(typeof original!=='function'||original._abNavigation)return;var wrapped=function(){var result=original.apply(this,arguments);updateAbyssTitle();return result;};wrapped._abNavigation=true;window[name]=wrapped;}
  function visibleButton(id){var button=document.getElementById(id);return button&&button.offsetParent!==null&&!button.disabled?button:null;}
  function flash(button){button.classList.add('ab-shortcut-flash');setTimeout(function(){button.classList.remove('ab-shortcut-flash');},350);button.click();}
  function showShortcuts(){openModal('<h3>⌨️ Abyss shortcuts</h3><div class="ab-shortcut-help"><span><kbd>D</kbd> Descend when available</span><span><kbd>B</kbd> Bank when available</span><span><kbd>I</kbd> Focus consumable preparation</span><span><kbd>R</kbd> Revive / Last Stand</span><span><kbd>L</kbd> Focus combat log</span><span><kbd>?</kbd> Open this guide</span></div><p class="muted small">Shortcuts pause while typing, while a dialog is open, or during live combat planning.</p><div class="modal-actions"><button id="modalOkBtn" onclick="closeModal()">Done</button></div>');}
  function initShortcuts(){document.addEventListener('keydown',function(event){var target=event.target,tag=target&&target.tagName,modal=document.getElementById('sharedModal'),live=document.querySelector('.ab-live-combat:not([hidden]),.ab-livecombat:not([hidden])');if(event.defaultPrevented||event.repeat||event.ctrlKey||event.metaKey||event.altKey||/INPUT|SELECT|TEXTAREA/.test(tag)||target&&target.isContentEditable||modal&&modal.classList.contains('open')||live&&live.offsetParent!==null)return;var key=event.key.toLowerCase(),button=null;if(key==='d')button=visibleButton('btnDescend');else if(key==='b')button=visibleButton('btnBank');else if(key==='r')button=visibleButton('btnRevive')||visibleButton('btnLastStand');else if(key==='i'){var prep=document.getElementById('prepPanel');if(prep&&prep.offsetParent!==null){event.preventDefault();prep.scrollIntoView({block:'center',behavior:window.reduceMotion?'auto':'smooth'});var item=prep.querySelector('button:not(:disabled),input:not(:disabled),select:not(:disabled)');if(item)item.focus();}return;}else if(key==='l'){var log=document.getElementById('logSearch');if(log){event.preventDefault();log.focus();log.scrollIntoView({block:'center'});}return;}else if(event.key==='?'){event.preventDefault();showShortcuts();return;}if(button){event.preventDefault();flash(button);}});}
  function init(){try{document.body.classList.toggle('ab-compact',localStorage.getItem('ab_compact')==='1');}catch(_){}persistTabs();initCollapsiblePanels();initLibrarySearch();initOverflow();wrapTitleSetter('setDepth');wrapTitleSetter('setEscrow');updateAbyssTitle();initShortcuts();activateDeepLink();window.addEventListener('hashchange',activateDeepLink);}
  setTimeout(init,0);
  window.showAbyssShortcuts=showShortcuts;
  window.__abyssNavigation={activateDeepLink:activateDeepLink,updateTitle:updateAbyssTitle,showShortcuts:showShortcuts};
})();
</script>
{{end}}
