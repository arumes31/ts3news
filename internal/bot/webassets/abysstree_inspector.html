{{define "abysstree-inspector"}}
<style>
.tree-inspector{margin:8px 0;padding:10px;border:1px solid rgba(65,201,122,.28);border-radius:10px;background:linear-gradient(140deg,rgba(15,39,35,.85),rgba(16,22,43,.9));display:grid;gap:8px}.tree-inspector-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tree-inspector-head h2{font-size:1rem;margin:0}.tree-inspector-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px}.tree-inspector-card{padding:8px;border-radius:7px;background:rgba(0,0,0,.2);font-size:.78rem;min-height:55px}.tree-inspector-card b{display:block;color:#83e6b3;margin-bottom:4px}.tree-inspector-card button{margin:2px 3px 2px 0}.tree-effect-benefit{color:#7ee787}.tree-effect-penalty{color:#ff7b89}.tree-route-node{stroke:#5bc0ff!important;stroke-width:4!important}.tree-glossary{border-bottom:1px dotted currentColor;cursor:help}.tree-inspector-empty{color:var(--muted)}
</style>
<script data-cfasync="false">
(function(){
  'use strict';
  var panel=document.createElement('section');panel.className='tree-inspector';panel.setAttribute('aria-label','Persistent node inspector');
  panel.innerHTML='<div class="tree-inspector-head"><h2 id="treeInspectorTitle">Node inspector</h2><span class="muted small" id="treeInspectorMeta">Select a node to inspect it.</span><button class="ghost xs" id="treeInspectorLink" type="button" style="display:none">Copy deep link</button></div><div class="tree-inspector-grid" id="treeInspectorGrid"><div class="tree-inspector-empty">Click or focus any node. Details remain here after the pointer moves away.</div></div>';
  var planner=document.querySelector('.tree-plan-panel');planner.parentNode.insertBefore(panel,planner.nextSibling);
  var selected=0,routeIndex=0,routeInfo=null,effectByKey={},discovered=[];(TREE_EFFECTS||[]).forEach(function(effect){effectByKey[effect.key]=effect;});try{discovered=JSON.parse(localStorage.getItem('abyssTreeDiscoveredNodes')||'[]').map(Number).filter(function(id,index,list){return !!byId[id]&&list.indexOf(id)===index;});}catch(_){discovered=[];}
  function rowButton(host,node,label){var button=document.createElement('button');button.className='ghost xs';button.type='button';button.textContent=label||node.name;button.addEventListener('click',function(){inspect(node.id,true);});host.appendChild(button);}
  function makeCard(title){var card=document.createElement('div');card.className='tree-inspector-card';var heading=document.createElement('b');heading.textContent=title;card.appendChild(heading);document.getElementById('treeInspectorGrid').appendChild(card);return card;}
  function addLine(card,text,className){var line=document.createElement('div');if(className)line.className=className;line.textContent=text;card.appendChild(line);}
  function statsLines(stats){return Object.keys(stats||{}).filter(function(key){return stats[key]!==0;}).map(function(key){return key+' '+(stats[key]>0?'+':'')+stats[key];});}
  function shortestRouteData(target){var distance={0:0},queue=[0],predecessors={0:[]};while(queue.length){var current=queue.shift();(adj[current]||[]).forEach(function(next){if(next!==0&&!byId[next])return;var candidate=distance[current]+1;if(typeof distance[next]==='undefined'){distance[next]=candidate;predecessors[next]=[current];queue.push(next);}else if(distance[next]===candidate){predecessors[next].push(current);}});}var counts={0:1};Object.keys(distance).map(Number).sort(function(a,b){return distance[a]-distance[b];}).forEach(function(id){if(id===0)return;counts[id]=(predecessors[id]||[]).reduce(function(sum,parent){return Math.min(1000000000,sum+(counts[parent]||0));},0);});return{distance:distance,predecessors:predecessors,counts:counts,total:counts[target]||0};}
  function routeAt(info,target,index){var reversed=[target],current=target,rank=index;while(current!==0){var parents=(info.predecessors[current]||[]).slice().sort(function(a,b){return a-b;});var chosen=parents[0];for(var i=0;i<parents.length;i++){var block=info.counts[parents[i]]||0;if(rank<block){chosen=parents[i];break;}rank-=block;}current=chosen;reversed.push(current);}return reversed.reverse();}
  function paintRoute(route){NODES.forEach(function(node){if(nodeEls[node.id])nodeEls[node.id].classList.toggle('tree-route-node',route.indexOf(node.id)>=0);});}
  function renderRouteCard(card,node){if(!routeInfo)routeInfo=shortestRouteData(node.id);var total=routeInfo.total;if(!total){addLine(card,'No root route found.');return;}routeIndex=Math.min(routeIndex,total-1);var route=routeAt(routeInfo,node.id,routeIndex);addLine(card,'Route '+(routeIndex+1)+' of '+(total>=1000000000?'1,000,000,000+':total)+' · '+(route.length-1)+' edges');var controls=document.createElement('div'),prev=document.createElement('button'),next=document.createElement('button');prev.className=next.className='ghost xs';prev.type=next.type='button';prev.textContent='← Previous';next.textContent='Next →';prev.disabled=routeIndex===0;next.disabled=routeIndex>=total-1;prev.addEventListener('click',function(){routeIndex--;render();});next.addEventListener('click',function(){routeIndex++;render();});controls.append(prev,next);card.appendChild(controls);var names=document.createElement('div');names.className='muted small';names.textContent=route.map(function(id){return id===0?'Root':byId[id].name;}).join(' → ');card.appendChild(names);paintRoute(route);}
  function whyLocked(node){if(alloc[node.id])return'Already allocated.';var gate=gateFloor(node);if(gate>bestDepth)return'Requires Abyss floor '+gate+'; your record is '+bestDepth+'.';var path=cheapestPathToAllocated(node.id);if(!path)return'No connected route from the active build.';if(used+path.cost>points)return'Cheapest route costs '+path.cost+' points; '+Math.max(0,points-used)+' remain.';return'Available now through a '+path.cost+'-point path.';}
  function jewelDescription(node){var code=sockets[node.id]||'';if(!code)return'Empty socket. Ruby boosts adjacent STR, Sapphire INT, and Topaz SPD.';if(code.indexOf('timeless_')===0){var parts=code.split('_'),radius=parts[2]==='large'?350:parts[2]==='medium'?220:120,bonus=parts[3]==='hp'?'+15 HP':'+5 '+parts[3].toUpperCase();var affected=NODES.filter(function(other){return alloc[other.id]&&Math.hypot(other.x-node.x,other.y-node.y)<=radius;}).length;return'Timeless seed '+parts[1]+' · '+parts[2]+' radius '+radius+' · '+bonus+' plus seed flavor on '+affected+' allocated nodes.';}var bits=code.split('_'),tier=Number(bits[1]||1);return bits[0]+' tier '+tier+' grants +'+(15*tier)+' '+(bits[0]==='ruby'?'STR':bits[0]==='sapphire'?'INT':'SPD')+' to each allocated adjacent node.';}
  function related(node){var keys=Object.keys(node.pct||{});return NODES.filter(function(other){if(other.id===node.id)return false;return keys.some(function(key){return other.pct&&Object.prototype.hasOwnProperty.call(other.pct,key);});}).sort(function(a,b){return Math.hypot(a.x-node.x,a.y-node.y)-Math.hypot(b.x-node.x,b.y-node.y);}).slice(0,5);}
  function render(){var node=byId[selected],grid=document.getElementById('treeInspectorGrid');grid.replaceChildren();if(!node){grid.textContent='Select a node to inspect it.';return;}document.getElementById('treeInspectorTitle').textContent=node.name;document.getElementById('treeInspectorMeta').textContent='ID '+node.id+' · '+(['War','Vitality','Shadow','Arcane','Fortune','Void'][node.sector]||node.sector)+' · ring '+node.ring+' · '+nodeCost(node)+' point'+(nodeCost(node)===1?'':'s');document.getElementById('treeInspectorLink').style.display='';
    var base=makeCard('Base-stat effects');var statLines=statsLines(node.stats);(statLines.length?statLines:['No flat stats']).forEach(function(line){addLine(base,line);});addLine(base,alloc[node.id]?'Current contribution: fully active.':'Current contribution: 0 until allocated.','muted small');
    var effects=makeCard('Percentage effects and glossary');var keys=Object.keys(node.pct||{});if(!keys.length)addLine(effects,'No percentage effects.');keys.forEach(function(key){var value=node.pct[key],meta=effectByKey[key],line=document.createElement('div'),link=document.createElement('a');line.className=value<0?'tree-effect-penalty':'tree-effect-benefit';line.appendChild(document.createTextNode((value>0?'+':'')+(value*100).toFixed(1)+'% '));link.href='#treeInspectorTitle';link.className='tree-glossary';link.textContent=meta?meta.label:key;link.title=meta?meta.description:'Server-defined effect.';link.addEventListener('click',function(event){event.preventDefault();abToast(link.title,true);});line.appendChild(link);line.appendChild(document.createTextNode(' — '+(meta?meta.description:'Server-defined effect.')));line.title='Effective after node-level soft caps: '+(value*100).toFixed(1)+'% (no node-level cap applies)';effects.appendChild(line);});addLine(effects,'Effective values equal the listed values; tree nodes have no separate node-level soft cap.','muted small');
    var trade=makeCard(node.type==='keystone'?'Keystone benefits and trade-offs':'Availability');var benefits=keys.filter(function(key){return node.pct[key]>=0;}),penalties=keys.filter(function(key){return node.pct[key]<0;});if(node.type==='keystone'){addLine(trade,'Benefits: '+(benefits.join(', ')||'none'),'tree-effect-benefit');addLine(trade,'Trade-offs: '+(penalties.join(', ')||'none'),'tree-effect-penalty');if(node.id===LIMIT_BREAK_ID)addLine(trade,'Limit Break is a conversion-style multiplier; inspect the aggregate preview before committing.');}addLine(trade,whyLocked(node));if(node.type==='keystone'){addLine(trade,'Active duration: '+Math.max(0,KEYSTONE_ACTIVE_SECS)+'s · cooldown: '+Math.max(0,KEYSTONE_CD_SECS)+'s');}
    var adjacent=makeCard('Adjacent nodes');var allocatedNeighbors=(adj[node.id]||[]).filter(function(id){return alloc[id]&&byId[id];}),availableNeighbors=(adj[node.id]||[]).filter(function(id){return byId[id]&&isAllocatable(id);});addLine(adjacent,'Allocated: '+allocatedNeighbors.length);allocatedNeighbors.forEach(function(id){rowButton(adjacent,byId[id]);});addLine(adjacent,'Allocatable: '+availableNeighbors.length);availableNeighbors.forEach(function(id){rowButton(adjacent,byId[id]);});
    var routeCard=makeCard('All shortest root routes');renderRouteCard(routeCard,node);
    if(node.type==='socket'){var jewel=makeCard('Jewel influence');addLine(jewel,jewelDescription(node));showTimelessRadius(node);}else hideTimelessRadius();
    var timing=makeCard('Rotations and timing');var seasonText=(document.getElementById('treeSeason').textContent||'').trim();addLine(timing,(node.sector===SEASONAL_SECTOR?'Active for this node: ':'Inactive for this node: ')+seasonText);var tomorrow=new Date();tomorrow.setUTCHours(24,0,0,0);addLine(timing,node.id===NODE_OF_DAY?'Node-of-the-day discount active until '+tomorrow.toLocaleString()+'.':'Node-of-the-day is #'+NODE_OF_DAY+' until '+tomorrow.toLocaleString()+'.');
    var progress=makeCard('Discovery progress');var sectorTotal=NODES.filter(function(other){return other.sector===node.sector;}),kindTotal=NODES.filter(function(other){return other.type===node.type;}),seen={};discovered.forEach(function(id){seen[id]=true;});addLine(progress,'Overall: '+discovered.length+' / '+NODES.length);addLine(progress,'This sector: '+sectorTotal.filter(function(other){return seen[other.id];}).length+' / '+sectorTotal.length);addLine(progress,node.type+': '+kindTotal.filter(function(other){return seen[other.id];}).length+' / '+kindTotal.length);
    var suggestions=makeCard('Related nodes');var list=related(node);if(!list.length)addLine(suggestions,'No same-effect suggestions.');list.forEach(function(other){rowButton(suggestions,other);});
    var skills=makeCard('Equipped skill detail model');if(!TREE_SKILLS||!TREE_SKILLS.length)addLine(skills,'No equipped skills.');(TREE_SKILLS||[]).forEach(function(skill){addLine(skills,skill.name+' · '+skill.role+' / '+skill.archetype);addLine(skills,skill.target_mode+' · '+skill.mana_cost+' mana · '+skill.cooldown_rounds+' round cooldown · '+skill.element);addLine(skills,'Effect '+skill.preview_min.toFixed(2)+'–'+skill.preview_max.toFixed(2)+' · scales with '+skill.scaling_stat+' · rank '+skill.upgrade_rank);addLine(skills,'Tags: '+skill.tags.join(', ')+' · duration '+skill.effect_duration_rounds+' · stack cap '+skill.stack_limit,'muted small');});
  }
  function inspect(id,focus){if(!byId[id])return;if(selected!==id){routeIndex=0;routeInfo=null;}selected=id;if(discovered.indexOf(id)<0){discovered.push(id);try{localStorage.setItem('abyssTreeDiscoveredNodes',JSON.stringify(discovered));}catch(_){}}render();var url=new URL(location.href);url.searchParams.set('node',String(id));history.replaceState(null,'',url.pathname+url.search+url.hash);if(focus){view.x=byId[id].x-view.w/2;view.y=byId[id].y-view.h/2;applyView();if(nodeEls[id])nodeEls[id].focus({preventScroll:true});}}
  svg.addEventListener('click',function(event){var target=event.target.closest&&event.target.closest('[data-id]');if(target)inspect(Number(target.getAttribute('data-id')),false);});svg.addEventListener('focusin',function(event){var id=Number(event.target&&event.target.getAttribute('data-id'));if(id)inspect(id,false);});
  document.getElementById('treeInspectorLink').addEventListener('click',async function(){var url=location.href;try{await navigator.clipboard.writeText(url);abToast('Node deep link copied.',true);}catch(_){window.prompt('Copy this node link:',url);}});
  var deep=Number(new URL(location.href).searchParams.get('node'));if(byId[deep])inspect(deep,true);
})();
</script>
{{end}}
