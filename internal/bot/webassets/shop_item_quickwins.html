{{define "shop-item-quickwins"}}
<script data-cfasync="false">
(function(){
  'use strict';
  var T=ItemTools,fields={},details=T.el('details',null,'item-tools');details.id='shopAdvancedFilters';details.appendChild(T.el('summary','Advanced item filters'));var controls=T.el('div',null,'item-tool-controls');details.appendChild(controls);document.querySelector('.shop-filters').after(details);
  function add(id,label,type,options){var c=type==='select'?T.select(options||[]):T.el('input');c.id=id;if(type!=='select'){c.type='number';c.min='0';c.step='any';}fields[id]=c;controls.appendChild(T.control(label,c));c.addEventListener('input',changed);c.addEventListener('change',changed);return c;}
  var statOptions=T.keys.map(function(k){return [k,k];});add('shopStatCode','Primary stat','select',statOptions).value='STR';add('shopMinStat','Minimum stat','number');add('shopPreserveStat','Preserve stat','select',[['','Any']].concat(statOptions));add('shopMinXP','Minimum effective XP bonus %','number');add('shopMinRegen','Minimum HP/s','number');add('shopMinSockets','Minimum sockets','number');add('shopSetFilter','Set','select',[['','All sets']]);add('shopEffectFilter','Effect','select',[['','All effects']]);
  var chips=T.el('div',null,'item-tool-controls');chips.id='shopActiveFilters';details.after(chips);var pinHost=T.el('section');pinHost.id='shopPinnedComparison';pinHost.hidden=true;pinHost.className='item-compare-pin';chips.after(pinHost);var pinned=null;
  [['value_power','Best stat power per gold'],['value_gain','Best positive gain per gold']].forEach(function(pair){var option=T.el('option',pair[1]);option.value=pair[0];document.getElementById('shopSort').appendChild(option);});
  function item(card){try{return JSON.parse(card.querySelector('[data-item-inspect]').dataset.itemInspect);}catch(_){return {};}}
  function comparison(card){try{return JSON.parse(card.dataset.comparisonDetail||'{}');}catch(_){return {unknown:true};}}
  function selectedValue(id){return fields[id].value;}
  function enough(id,value){var minimum=selectedValue(id);return minimum===''||Number(value)>=Number(minimum);}
  function matches(card){var g=item(card),c=comparison(card),stats=g.stat_details||g.stats||[],code=selectedValue('shopStatCode'),stat=stats.find(function(s){return (s.code||s.label)===code;}),preserved=selectedValue('shopPreserveStat'),delta=(c.all_stats||c.changes||[]).find(function(s){return s.code===preserved||s.label===preserved;});return enough('shopMinStat',stat&&stat.value||0)&&(!preserved||!c.unknown&&(!delta||delta.delta>=0))&&enough('shopMinXP',g.xp_detail&&g.xp_detail.effective_bonus_pct||0)&&enough('shopMinRegen',g.regen_rate||0)&&enough('shopMinSockets',g.sockets||0)&&(!selectedValue('shopSetFilter')||g.set_id===selectedValue('shopSetFilter'))&&(!selectedValue('shopEffectFilter')||(g.specials||[]).some(function(s){return s.name===selectedValue('shopEffectFilter');}))&&(document.getElementById('shopSort').value!=='value_gain'||Number(card.dataset.gain)>0);}
  function labels(){chips.replaceChildren();Object.keys(fields).forEach(function(id){var c=fields[id];if(!c.value||id==='shopStatCode')return;var label=c.parentElement.firstChild.textContent+' '+(c.selectedOptions?c.selectedOptions[0].textContent:c.value);var chip=T.button(label+' ×',function(){c.value='';changed();});chip.classList.add('item-chip');chip.setAttribute('aria-label','Remove '+label+' filter');chips.appendChild(chip);});var statuses={};shopCards.forEach(function(card){if(matches(card))statuses[card.dataset.comparison]=(statuses[card.dataset.comparison]||0)+1;});[...document.getElementById('shopComparison').options].forEach(function(o){if(!o.dataset.label)o.dataset.label=o.textContent;o.textContent=o.dataset.label+(o.value?' ('+(statuses[o.value]||0)+')':'');});var empty=document.getElementById('shopEmpty');if(!empty.hidden)empty.textContent='No items match '+(chips.children.length?[...chips.children].map(function(c){return c.textContent.replace(' ×','');}).join(', '):'the selected search, slot, comparison, or affordability filters')+'. Remove a filter or reset the filters.';}
  function changed(){try{sessionStorage.setItem('shopAdvancedFilters',JSON.stringify(Object.fromEntries(Object.keys(fields).map(function(k){return [k,fields[k].value];}))));}catch(_){}shopVisibleLimit=shopPageSize;sortShopStock();filterShopStock();labels();}
  function renderPin(){pinHost.replaceChildren();pinHost.hidden=!pinned;if(!pinned)return;pinHost.appendChild(T.el('strong','Pinned: '+pinned.item.name+' · '+T.fmt(pinned.price)+' gold'));pinHost.appendChild(T.button('Unpin',function(){pinned=null;sessionStorage.removeItem('shopPinnedItem');renderPin();}));T.mount(pinHost,pinned.comparison);}
  function refreshCards(){var sets=new Set(),effects=new Set();shopCards.forEach(function(card){var g=item(card),c=comparison(card);if(g.set_id)sets.add(g.set_id);(g.specials||[]).forEach(function(s){effects.add(s.name);});var host=card.querySelector('.shop-comparison')||card.querySelector('.shop-item-details');T.mount(host,c);var heading=host.querySelector('h4');if(heading&&c.equipped_rarity&&!heading.dataset.enriched){heading.dataset.enriched='true';heading.appendChild(T.el('small',' · '+c.equipped_rarity+' · temper +'+(c.equipped_temper||0)));}var state=host.querySelector('p strong');if(state&&!state.dataset.enriched){state.dataset.enriched='true';state.textContent=(T.icons[c.status]||'?')+' '+c.status;}
      if(!card.querySelector('.shop-pin-comparison')){var actions=card.querySelector('.shop-card-actions');var pin=T.button('Pin comparison',function(){pinned={item:item(card),comparison:comparison(card),price:Number(card.dataset.price)};try{sessionStorage.setItem('shopPinnedItem',JSON.stringify(pinned));}catch(_){}renderPin();});pin.classList.add('shop-pin-comparison');var compare=T.button('Compare with pinned',function(){if(!pinned){T.announce('Pin an offer first.');return;}var old=pinHost.querySelector('.item-offer-comparison');if(old)old.remove();var box=T.el('div',null,'item-offer-comparison');box.appendChild(T.el('h4',g.name+' versus '+pinned.item.name));pinHost.appendChild(box);var table=T.mount(box,T.compareItems(g,pinned.item));table.open=true;pinHost.scrollIntoView({block:'nearest'});});compare.classList.add('shop-compare-offer');actions.append(pin,compare);}
      var affordability=card.querySelector('.shop-affordability');if(affordability&&Number(card.dataset.price)>shopCurrentGold)affordability.textContent='Need '+T.fmt(Number(card.dataset.price)-shopCurrentGold)+' more gold';
    });[['shopSetFilter',sets],['shopEffectFilter',effects]].forEach(function(pair){var c=fields[pair[0]],value=c.value;while(c.options.length>1)c.remove(1);[...pair[1]].sort().forEach(function(v){var o=T.el('option',v);o.value=v;c.appendChild(o);});c.value=value;});}
  window.shopExtraMatches=matches;window.shopExtraSort=function(a,b,kind){var gain=kind==='value_gain';var av=Number(gain?a.dataset.gain:a.dataset.power)/Math.max(1,Number(a.dataset.price)),bv=Number(gain?b.dataset.gain:b.dataset.power)/Math.max(1,Number(b.dataset.price));return bv-av;};window.shopQuickSummary=function(button){var card=button&&button.closest('.shop-card');return card?T.summary(comparison(card)):'';};window.shopQuickwinsChanged=labels;
  window.refreshShopComparisons=async function(button){var position=window.scrollY;try{var response=await fetch(location.href,{headers:{'X-Requested-With':'item-comparison-refresh'}});if(!response.ok)throw Error('Refresh failed');var doc=new DOMParser().parseFromString(await response.text(),'text/html'),grid=doc.getElementById('shopGrid');if(!grid)throw Error('Comparison data unavailable');var offers=[...grid.querySelectorAll('.shop-card')];grid.querySelectorAll('template.shop-stock-offer').forEach(function(t){offers.push(...t.content.querySelectorAll('.shop-card'));});var live=document.getElementById('shopGrid');live.replaceChildren();live.dataset.stockRevision=grid.dataset.stockRevision;shopCards=offers;shopSortedCards=offers.slice();refreshCards();sortShopStock();shopRefreshPending=false;shopPurchasePending=false;filterShopStock();labels();window.scrollTo(0,position);T.announce('Equipment comparisons updated after purchase.');}catch(error){showShopResult('Purchase completed. Refresh the shop to update equipment comparisons.',false,button);shopRefreshPending=true;syncShopMutationButtons();}};
  document.getElementById('shopReset').addEventListener('click',function(){Object.keys(fields).forEach(function(id){fields[id].value=id==='shopStatCode'?'STR':'';});changed();});document.getElementById('shopSort').addEventListener('change',labels);document.getElementById('shopComparison').addEventListener('change',labels);
  refreshCards();try{var saved=JSON.parse(sessionStorage.getItem('shopAdvancedFilters')||'{}');Object.keys(fields).forEach(function(id){if(typeof saved[id]==='string')fields[id].value=saved[id];});pinned=JSON.parse(sessionStorage.getItem('shopPinnedItem')||'null');}catch(_){}renderPin();sortShopStock();filterShopStock();labels();
})();
</script>
{{end}}
