{{define "forge-quickwins"}}
<script data-cfasync="false">
window.installForgeQuickwins=function(api){
  'use strict';
  var T=ItemTools,root=document.getElementById('forgePlanner'),items=document.getElementById('forgeItemSelect'),operation=document.getElementById('forgePlanOperation'),advanced=document.getElementById('forgeAdvancedControls');
  var expiry=T.el('p','','small');expiry.id='forgeQuoteExpiry';expiry.setAttribute('role','status');document.getElementById('forgeQuotePanel').prepend(expiry);
  var renew=T.button('Renew quote',api.refresh);renew.id='forgeQuoteRenew';renew.hidden=true;expiry.after(renew);
  var changed=T.el('input');changed.type='checkbox';changed.id='forgeChangedStats';var options=T.el('div',null,'item-tool-controls');options.append(T.control('Changed stats only',changed));document.getElementById('forgeQuoteOutcomes').before(options);
  var detail=T.el('div');detail.id='forgeQuoteDetails';document.getElementById('forgeQuoteOutcomes').after(detail);
  function updateRows(){document.querySelectorAll('#forgeQuoteOutcomes .forge-stat-line').forEach(function(row){row.hidden=changed.checked&&row.dataset.changed!=='true';});}changed.addEventListener('change',updateRows);
  var disclosure=T.el('details',null,'forge-advanced-disclosure');disclosure.append(T.el('summary','Advanced operation settings'));advanced.before(disclosure);disclosure.appendChild(advanced);
  var essential=T.el('div',null,'item-tool-controls');disclosure.before(essential);
  ['forgeTemperCommit','forgeGemUpgradeCommit','forgeTargetCraftCommit','forgeReforgeCommit','forgeEtchCommit','forgeExtractCommit','forgeCorruptCommit','forgeSpecialCommit','forgeMasterworkTransferCommit'].forEach(function(id){var b=document.getElementById(id);if(b)essential.appendChild(b);});
  var commitOperations={forgeTemperCommit:'batch_temper',forgeGemUpgradeCommit:'gem_upgrade_all',forgeTargetCraftCommit:'target_craft',forgeReforgeCommit:'reforge',forgeEtchCommit:'etch_rune',forgeExtractCommit:'extract_gem',forgeCorruptCommit:'corrupt',forgeSpecialCommit:'special_reroll',forgeMasterworkTransferCommit:'masterwork_transfer'};
  function updateActions(q){Object.keys(commitOperations).forEach(function(id){var b=document.getElementById(id);b.hidden=operation.value!==commitOperations[id];b.disabled=!q||q.operation!==commitOperations[id];b.title=b.disabled?'A current quote for this operation is required.':'';});}
  var defaults={};advanced.querySelectorAll('input,select').forEach(function(c){defaults[c.id]={value:c.value,checked:c.checked};});essential.appendChild(T.button('Reset operation settings',function(){Object.keys(defaults).forEach(function(id){var c=document.getElementById(id),saved=defaults[id];c.value=saved.value;c.checked=saved.checked;});api.invalidate('Settings reset. Refreshing quote.');api.refresh();}));
  var search=T.el('input');search.type='search';search.id='forgeWorkpieceSearch';search.placeholder='Search forge items';search.setAttribute('aria-label','Search forge workpieces');var compatible=T.el('input');compatible.type='checkbox';compatible.id='forgeCompatibleOnly';var controls=T.el('div',null,'item-tool-controls');controls.append(search,T.control('Compatible only',compatible));items.before(controls);var count=T.el('p','','muted small');controls.after(count);
  var allOptions=[...items.options].filter(function(o){return o.value;});allOptions.forEach(function(o){if(o.value.startsWith('inv:')&&!o.textContent.includes(' · #'))o.textContent+=' · #'+o.value.slice(4);});
  // Preserve existing groups; normalize only ungrouped options.
  ['equipped:','inv:'].forEach(function(prefix){var loose=allOptions.filter(function(o){return o.value.startsWith(prefix)&&o.parentElement===items;});if(loose.length){var group=T.el('optgroup');group.label=prefix==='inv:'?'Inventory':'Equipped';loose.forEach(function(o){group.appendChild(o);});items.appendChild(group);}});
  function catalog(){return api.operations.find(function(o){return o.id===operation.value;});}
  function eligible(option){var op=catalog();return !op||!op.requires_gear||(!op.compatible_slots||op.compatible_slots.includes(option.dataset.slot))&&Number(option.dataset.rarity)>=Number(op.minimum_rarity||0);}
  function filterItems(){var visible=0,possible=0,q=search.value.toLowerCase();allOptions.forEach(function(o){var valid=eligible(o);if(valid)possible++;o.hidden=!(o.textContent.toLowerCase().includes(q)&&(!compatible.checked||valid));if(!o.hidden)visible++;});count.textContent=visible+' visible workpieces · '+possible+' compatible with '+(catalog()&&catalog().label||operation.value);}
  function settings(){updateActions(active);var op=operation.value;var show={forgeOutcomeFamily:/reforge|awaken/.test(op),forgeRiskTier:/corrupt|reforge/.test(op),forgeFailurePolicy:/batch|queue/.test(op),forgeBatchTarget:/batch|queue/.test(op),forgeGemStopTier:/gem_upgrade/.test(op),forgeGemFamily:/gem/.test(op),forgeGemIndex:/gem|socket/.test(op),forgeRuneFamily:/rune/.test(op),forgeRuneElement:/rune/.test(op),forgeQualityFloor:/reforge/.test(op),forgeRecalibrationCap:/recalibr/.test(op),forgeLockedStats:/reforge|rebalance/.test(op),forgeExcludedEffects:/special/.test(op),forgeStatPreset:/reforge/.test(op),forgeCustomWeights:/reforge/.test(op),forgeCompareItem:true,forgeTargetSlot:/target_craft/.test(op),forgeTargetRarity:/target_craft/.test(op),forgeTargetSet:/target_craft/.test(op),forgeDuplicatePolicy:/target_craft/.test(op),forgeEventRecipe:/target_craft/.test(op),forgeProtection:/corrupt|temper/.test(op)};Object.keys(show).forEach(function(id){var c=document.getElementById(id);if(c)(c.closest('label')||c).hidden=!show[id];});filterItems();try{sessionStorage.setItem('forgeLastOperation',op);}catch(_){};}
  search.addEventListener('input',filterItems);compatible.addEventListener('change',filterItems);operation.addEventListener('change',settings);
  var timer;advanced.addEventListener('input',function(){api.invalidate('Settings changed. Refreshing quote.');clearTimeout(timer);timer=setTimeout(api.refresh,180);});advanced.addEventListener('change',function(){api.invalidate('Settings changed. Refreshing quote.');clearTimeout(timer);timer=setTimeout(api.refresh,180);});
  var comparePreview=T.el('div',null,'item-tools');comparePreview.id='forgeComparedItemPreview';document.getElementById('forgeComparison').after(comparePreview);
  function showComparison(){var selected=document.getElementById('forgeCompareItem').value,option=allOptions.find(function(o){return o.value===selected;});comparePreview.replaceChildren();if(!option)return;comparePreview.appendChild(T.el('strong','Comparison item: '+option.textContent));try{var stats=JSON.parse(option.dataset.stats||'{}');comparePreview.appendChild(T.el('p',T.keys.filter(function(k){return stats[k];}).map(function(k){return k+' '+T.fmt(stats[k]);}).join(' · ')));}catch(_){}}
  document.getElementById('forgeCompareItem').addEventListener('change',showComparison);
  var unavailable=T.el('p','','muted small');unavailable.id='forgeUnavailableReason';essential.after(unavailable);
  function explainUnavailable(){var selected=items.options[items.selectedIndex],op=catalog()||{};var message=op.requires_gear&&(!selected||!selected.value)?'Choose a workpiece to see available actions.':op.requires_gear&&selected&&!eligible(selected)?'Requires '+(op.compatible_slots||[]).join(', ')+' equipment at rarity tier '+op.minimum_rarity+' or higher.':(op.prerequisites||[]).join(' · ');unavailable.textContent=message;essential.querySelectorAll('button').forEach(function(b){if(b.disabled)b.title=message||'Refresh a valid quote and check the item requirements.';});}
  items.addEventListener('change',explainUnavailable);operation.addEventListener('change',explainUnavailable);explainUnavailable();
  var receiptHost=T.el('div',null,'item-tools');receiptHost.id='forgeActualReceipts';document.getElementById('forgeReceipts').after(receiptHost);var actual=[];try{actual=JSON.parse(sessionStorage.getItem('forgeActualReceipts')||'[]');}catch(_){}
  function renderActual(){receiptHost.replaceChildren();actual.slice(0,6).forEach(function(receipt){receiptHost.appendChild(T.el('p',receipt.operation+' · '+receipt.changes.map(function(s){return s.label+' '+T.fmt(s.before)+' → '+T.fmt(s.after)+' ('+T.fmt(s.delta,true)+')';}).join(' · ')));});}renderActual();
  var originalPost=window.abPost;if(originalPost)window.abPost=async function(path,payload){var result=await originalPost(path,payload);if(result&&result.ok&&Array.isArray(result.stat_changes)&&result.stat_changes.length){actual.unshift({operation:path.split('/').pop().replaceAll('_',' '),changes:result.stat_changes});actual=actual.slice(0,6);try{sessionStorage.setItem('forgeActualReceipts',JSON.stringify(actual));}catch(_){}renderActual();}return result;};
  var active=null;
  document.addEventListener('forgequotechange',function(event){active=event.detail;updateActions(active);detail.replaceChildren();renew.hidden=true;if(!active){expiry.textContent='';return;}var q=active,current=q.current_item||q.current,stats=current&&current.Stats||{},after=q.outcome.success_stats||q.outcome.maximum_stats||{};detail.appendChild(T.el('p',(current?current.Name+' · '+current.Slot:'No existing item')+' · '+q.operation));
    var deltas=T.keys.filter(function(k){return Number(stats[k]||0)!==Number(after[k]||0);});if(current&&!deltas.length)detail.appendChild(T.el('p','No immediate stat gain. Whole-stat rounding may absorb small increases; other item properties may still change.','item-shortfall'));
    if(current){var scale={temper:.02,masterwork:.03,attune:.05,upgrade_gear:.3,infuse_curse:.25,infuse_eldritch:.25}[q.operation];var rounded=scale?T.keys.filter(function(k){return stats[k]>0&&Number(after[k]||0)===stats[k];}):[];if(rounded.length)detail.appendChild(T.el('p','Increases rounded away: '+rounded.join(', ')+'.'));var worse=deltas.filter(function(k){return after[k]<stats[k];});if(worse.length)detail.appendChild(T.el('p','Stats decrease on success: '+worse.map(function(k){return k+' '+T.fmt(after[k]-stats[k],true);}).join(', '),'item-shortfall'));var levels={temper:['temper',15],reinforce:['reinforced',10],sharpen:['sharpened',10],masterwork:['quality',5]};if(levels[q.operation]){var spec=levels[q.operation],level=Number(current[spec[0]]||0);detail.appendChild(T.el('p','Level '+level+' → '+Math.min(spec[1],level+1)+' / '+spec[1]));}}
    var balance=q.balance_after||{},missing=[];if(balance.gold<0)missing.push(T.fmt(-balance.gold)+' gold');if(balance.tokens<0)missing.push(T.fmt(-balance.tokens)+' tokens');Object.keys(balance.materials||{}).forEach(function(k){if(balance.materials[k]<0)missing.push(T.fmt(-balance.materials[k])+' '+k.replaceAll('_',' '));});if(missing.length)detail.appendChild(T.el('p','Missing: '+missing.join(', '),'item-shortfall'));updateRows();tick();
  });
  function tick(){if(!active)return;var expires=Date.parse(active.expires_at);if(!Number.isFinite(expires))return;var seconds=Math.max(0,Math.ceil((expires-Date.now())/1000));if(!seconds){api.invalidate('Quote expired. Renew it before continuing.');expiry.textContent='Quote expired';renew.hidden=false;}else expiry.textContent='Quote valid for '+seconds+' seconds';}setInterval(tick,1000);
  api.copy=function(q){var c=q.current_item||q.current;var stats=c&&c.Stats||{};var delta=T.keys.filter(function(k){return (q.outcome.expected_stats||{})[k]!==stats[k]&&((q.outcome.expected_stats||{})[k]||stats[k]);}).map(function(k){return k+' '+T.fmt(stats[k]||0)+' → '+T.fmt(q.outcome.expected_stats[k]||0)+' ('+T.fmt((q.outcome.expected_stats[k]||0)-(stats[k]||0),true)+')';});T.copy((c&&c.Name||'No existing item')+' · '+q.operation+'\n'+q.chance_explanation+'\n'+delta.join('\n')+'\nCost: '+T.fmt(q.cost.gold||0)+' gold, '+T.fmt(q.cost.tokens||0)+' tokens; '+Object.entries(q.cost.materials||{}).map(function(p){return p[0].replaceAll('_',' ')+' '+T.fmt(p[1]);}).join(', '),detail);};
  try{var saved=sessionStorage.getItem('forgeLastOperation');if(saved&&[...operation.options].some(function(o){return o.value===saved;})){operation.value=saved;api.guide();}var ref=sessionStorage.getItem('itemForgeSelection');if(ref&&allOptions.some(function(o){return o.value===ref;})){var openSelected=function(){items.value=ref;sessionStorage.removeItem('itemForgeSelection');var tab=document.querySelector('.ab-tab[data-tab-key="forge"]');if(tab)tab.click();items.dispatchEvent(new Event('change',{bubbles:true}));};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){requestAnimationFrame(openSelected);},{once:true});else openSelected();}}catch(_){}settings();
};
</script>
{{end}}
