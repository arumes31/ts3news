{{define "abyss-forge-workstation"}}
<style>
.forge-workstation{margin:10px 0;padding:10px;border:1px solid rgba(244,197,66,.24);border-radius:10px;background:linear-gradient(145deg,rgba(40,28,18,.7),rgba(18,24,38,.82));display:grid;gap:9px}
.forge-discipline-tabs,.forge-picker-filters,.forge-picker-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.forge-discipline-tabs button.active{border-color:#f4c542;color:#f4c542;background:rgba(244,197,66,.1)}
.forge-picker-filters input,.forge-picker-filters select{min-height:36px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:#121725;color:var(--text);padding:5px 8px}
.forge-picker-filters input{flex:1 1 190px}.forge-picker-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;max-height:310px;overflow:auto;padding:2px}
.forge-picker-item{display:grid;grid-template-columns:1fr auto;gap:4px 8px;text-align:left;padding:8px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:rgba(0,0,0,.18);color:var(--text);cursor:pointer;min-height:58px}
.forge-picker-item:hover,.forge-picker-item:focus-visible{border-color:#5bc0ff;outline:none}.forge-picker-item.selected{border-color:#f4c542;box-shadow:0 0 0 1px rgba(244,197,66,.2)}
.forge-picker-item .forge-item-sub{font-size:.72rem;color:var(--muted);grid-column:1}.forge-picker-item .forge-favorite{grid-column:2;grid-row:1/3;font-size:1.1rem;align-self:center}
.forge-empty-guide{padding:12px;border:1px dashed rgba(255,255,255,.18);border-radius:8px;color:var(--muted)}
.ab-bp-forge{margin-left:4px;min-width:42px}.ab-bp-row{min-height:44px}
@media(max-width:700px){.forge-picker-list{grid-template-columns:1fr}.forge-picker-item{min-height:68px}.forge-discipline-tabs button{min-height:42px;flex:1 1 120px}}
</style>
<script data-cfasync="false">
(function(){
  'use strict';
  var root=document.getElementById('abyssForgePanel'),nativeSelect=document.getElementById('forgeItemSelect');
  if(!root||!nativeSelect)return;
  var catalog={{jsonJS .ForgeCatalog}}||{},operations={{jsonJS .ForgeOperations}}||[];
  var catalogVersion=Number(catalog.schema_version),operationCount=Number(catalog.operation_count);
  var catalogLabel=Number.isFinite(catalogVersion)&&catalogVersion>0?'Catalog v'+catalogVersion:'Catalog';
  if(!Number.isFinite(operationCount)||operationCount<0)operationCount=operations.length;
  var workstation=document.createElement('div');workstation.className='forge-workstation';workstation.setAttribute('aria-label','Forge workstation navigator');
  workstation.innerHTML='<div class="forge-picker-meta"><b>Foundry navigator</b><span class="muted small">'+catalogLabel+' · '+operationCount+' operations</span></div>'+
    '<div class="forge-discipline-tabs" role="tablist" aria-label="Forge disciplines"></div>'+
    '<div class="forge-picker-filters"><input id="forgeItemSearch" type="search" placeholder="Search items…" aria-label="Search forge items">'+
    '<select id="forgeSlotFilter" aria-label="Slot"><option value="">All slots</option></select><select id="forgeRarityFilter" aria-label="Rarity"><option value="">All rarities</option></select>'+
    '<select id="forgeSetFilter" aria-label="Set"><option value="">All sets</option></select><select id="forgeEligibilityFilter" aria-label="Eligibility"><option value="">Any eligibility</option><option value="eligible">Eligible here</option><option value="ineligible">Ineligible here</option></select>'+
    '<select id="forgeSocketFilter" aria-label="Socket state"><option value="">Any sockets</option><option value="open">Open socket</option><option value="filled">Has gems</option><option value="none">No sockets</option></select>'+
    '<select id="forgeCorruptFilter" aria-label="Corruption state"><option value="">Any corruption</option><option value="clean">Clean</option><option value="corrupted">Corrupted</option></select>'+
    '<select id="forgeDurabilityFilter" aria-label="Durability state"><option value="">Any durability</option><option value="damaged">Damaged</option><option value="healthy">Healthy</option></select>'+
    '<select id="forgeItemSort" aria-label="Sort items"><option value="cr">Combat rating</option><option value="improvement">Projected improvement</option><option value="cost">Operation cost</option><option value="name">Name</option></select></div>'+
    '<div class="forge-picker-meta"><span id="forgePickerCount" class="muted small" role="status" aria-live="polite"></span><span class="muted small">↑/↓ navigate · Enter selects</span></div><div id="forgePickerList" class="forge-picker-list"></div>'+
    '<div class="forge-picker-meta"><b class="small">Recently forged:</b><span id="forgeRecentItems" class="muted small">none yet</span></div>';
  root.querySelector('.ab-forge').insertBefore(workstation,root.querySelector('.ab-forge').firstChild);

  var labels={all:'All stations',smithing:'Smithing',enchanting:'Enchanting',gemcraft:'Gemcraft',transmutation:'Transmutation',ascension:'Ascension',maintenance:'Maintenance'};
  var active='all',favorites=[],recent=[];
  try{favorites=JSON.parse(localStorage.getItem('abyssForgeFavorites')||'[]');recent=JSON.parse(localStorage.getItem('abyssForgeRecentItems')||'[]');active=sessionStorage.getItem('abyssForgeDiscipline')||'all';}catch(_){}
  if(!labels[active])active='all';
  var items=Array.prototype.slice.call(nativeSelect.options).filter(function(option){return !!option.value;}).map(function(option){
    var tip=option.getAttribute('data-tip')||'',name=(tip.split('\n')[0]||option.textContent||'').trim(),slot=option.getAttribute('data-slot')||'';
    return{option:option,value:option.value,name:name,search:(name+' '+slot+' '+tip).toLowerCase(),slot:slot,rarity:Number(option.getAttribute('data-rarity')||0),set:typeof abSetOfName==='function'?(abSetOfName(name)||''):'',sockets:Number(option.getAttribute('data-sockets')||0),gems:Number(option.getAttribute('data-gems')||0),corrupted:option.getAttribute('data-corrupted')==='true',durability:Number(option.getAttribute('data-dur')||0),cr:Number(option.getAttribute('data-cr')||0),temper:Number(option.getAttribute('data-temper')||0)};
  });
  function exists(value){return items.some(function(item){return item.value===value;});}
  favorites=favorites.filter(function(value,index,list){return exists(value)&&list.indexOf(value)===index;});recent=recent.filter(function(value,index,list){return exists(value)&&list.indexOf(value)===index;}).slice(0,8);
  function save(){try{localStorage.setItem('abyssForgeFavorites',JSON.stringify(favorites));localStorage.setItem('abyssForgeRecentItems',JSON.stringify(recent));sessionStorage.setItem('abyssForgeDiscipline',active);}catch(_){}}

  var tabs=workstation.querySelector('.forge-discipline-tabs');Object.keys(labels).forEach(function(id){var button=document.createElement('button');button.className='ghost xs';button.type='button';button.setAttribute('role','tab');button.dataset.discipline=id;button.textContent=labels[id];button.addEventListener('click',function(){active=id;save();renderTabs();render();applyDiscipline();});tabs.appendChild(button);});
  function renderTabs(){tabs.querySelectorAll('button').forEach(function(button){var on=button.dataset.discipline===active;button.classList.toggle('active',on);button.setAttribute('aria-selected',on?'true':'false');});}
  var slots={},rarities={},sets={};items.forEach(function(item){slots[item.slot]=true;rarities[item.rarity]=true;if(item.set)sets[item.set]=true;});
  function populate(id,values,label){var select=document.getElementById(id);Object.keys(values).sort(function(a,b){return Number(a)-Number(b)||a.localeCompare(b);}).forEach(function(value){var option=document.createElement('option');option.value=value;option.textContent=label(value);select.appendChild(option);});}
  var rarityNames=['Common','Uncommon','Rare','Epic','Legendary','Mythic','Divine','Celestial','Eternal'];populate('forgeSlotFilter',slots,function(value){return value;});populate('forgeRarityFilter',rarities,function(value){return rarityNames[Number(value)]||('Rarity '+value);});populate('forgeSetFilter',sets,function(value){return value;});

  function activeOperations(){return operations.filter(function(operation){return active==='all'||operation.discipline===active;});}
  function eligible(item){var choices=activeOperations().filter(function(operation){return operation.requires_gear;});if(!choices.length)return active==='all';return choices.some(function(operation){return item.rarity>=operation.minimum_rarity&&operation.compatible_slots.indexOf(item.slot)>=0;});}
  function uplift(item){return Math.max(0,8-item.rarity)*8+Math.max(0,20-item.temper)*2+Math.max(0,4-item.sockets)*3+(item.corrupted?0:12);}
  function filtered(){var q=document.getElementById('forgeItemSearch').value.toLowerCase().trim(),slot=document.getElementById('forgeSlotFilter').value,rarity=document.getElementById('forgeRarityFilter').value,set=document.getElementById('forgeSetFilter').value,eligibility=document.getElementById('forgeEligibilityFilter').value,socket=document.getElementById('forgeSocketFilter').value,corruption=document.getElementById('forgeCorruptFilter').value,durability=document.getElementById('forgeDurabilityFilter').value;
    var result=items.filter(function(item){if(q&&item.search.indexOf(q)<0)return false;if(slot&&item.slot!==slot)return false;if(rarity!==''&&item.rarity!==Number(rarity))return false;if(set&&item.set!==set)return false;var ok=eligible(item);if((eligibility==='eligible'&&!ok)||(eligibility==='ineligible'&&ok))return false;if((socket==='open'&&!(item.sockets>item.gems))||(socket==='filled'&&!(item.gems>0))||(socket==='none'&&item.sockets!==0))return false;if((corruption==='clean'&&item.corrupted)||(corruption==='corrupted'&&!item.corrupted))return false;if((durability==='damaged'&&!(item.durability>0&&item.durability<100))||(durability==='healthy'&&item.durability>0&&item.durability<100))return false;return true;});
    var sort=document.getElementById('forgeItemSort').value;result.sort(function(a,b){var pinned=(favorites.indexOf(b.value)>=0?1:0)-(favorites.indexOf(a.value)>=0?1:0);if(pinned)return pinned;if(sort==='name')return a.name.localeCompare(b.name);if(sort==='cost')return a.rarity-b.rarity||b.cr-a.cr;if(sort==='improvement')return uplift(b)-uplift(a)||b.cr-a.cr;return b.cr-a.cr;});return result;
  }
  function select(value,scroll){if(!exists(value)){nativeSelect.value='';sessionStorage.removeItem('forge_selected_item');return;}nativeSelect.value=value;nativeSelect.dispatchEvent(new Event('change',{bubbles:true}));render();if(scroll)document.getElementById('forgeActions').scrollIntoView({behavior:'smooth',block:'start'});}
  function favorite(value,event){event.stopPropagation();var index=favorites.indexOf(value);if(index>=0)favorites.splice(index,1);else favorites.push(value);save();render();}
  function render(){var list=document.getElementById('forgePickerList'),visible=filtered();list.replaceChildren();document.getElementById('forgePickerCount').textContent=visible.length+' item'+(visible.length===1?'':'s')+' shown';if(!visible.length){var empty=document.createElement('div');empty.className='forge-empty-guide';empty.textContent=active==='all'?'No item matches these filters.':'No compatible item found for '+labels[active]+'. Clear filters, identify gear, or return after finding a suitable item.';list.appendChild(empty);return;}visible.forEach(function(item){var button=document.createElement('button');button.type='button';button.className='forge-picker-item'+(nativeSelect.value===item.value?' selected':'');button.dataset.value=item.value;button.setAttribute('aria-label','Select '+item.name+' for forging');var name=document.createElement('span');name.textContent=item.name;var sub=document.createElement('span');sub.className='forge-item-sub';sub.textContent=item.slot+' · '+(rarityNames[item.rarity]||'Unknown')+' · CR '+item.cr.toFixed(0)+' · uplift '+uplift(item);var star=document.createElement('span');star.className='forge-favorite';star.textContent=favorites.indexOf(item.value)>=0?'★':'☆';star.title='Pin forge item';star.addEventListener('click',function(event){favorite(item.value,event);});button.append(name,sub,star);button.addEventListener('click',function(){select(item.value,false);});list.appendChild(button);});}
  function applyDiscipline(){var mapping={'🛠️':'smithing','✨':'ascension','💎':'gemcraft','🧿':'maintenance','🧪':'enchanting','🧰':'maintenance','⚗️':'transmutation','📜':'all'};root.querySelectorAll('details.ab-acc').forEach(function(details){var summary=details.querySelector('summary'),discipline='all';Object.keys(mapping).some(function(prefix){if(summary&&summary.textContent.indexOf(prefix)>=0){discipline=mapping[prefix];return true;}return false;});details.style.display=active==='all'||discipline==='all'||discipline===active?'':'none';});}
  workstation.querySelectorAll('input,select').forEach(function(control){control.addEventListener('input',render);control.addEventListener('change',render);});
  document.getElementById('forgeItemSearch').addEventListener('keydown',function(event){var buttons=workstation.querySelectorAll('.forge-picker-item');if(!buttons.length)return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();buttons[event.key==='ArrowDown'?0:buttons.length-1].focus();}});
  document.getElementById('forgePickerList').addEventListener('keydown',function(event){var buttons=Array.prototype.slice.call(this.querySelectorAll('.forge-picker-item')),index=buttons.indexOf(document.activeElement);if(index<0)return;if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();buttons[(index+(event.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length].focus();}else if(event.key==='Enter'){event.preventDefault();document.activeElement.click();}});
  function renderRecent(){var host=document.getElementById('forgeRecentItems');host.replaceChildren();if(!recent.length){host.textContent='none yet';return;}recent.forEach(function(value,index){var item=items.find(function(candidate){return candidate.value===value;});if(!item)return;if(index)host.appendChild(document.createTextNode(' · '));var button=document.createElement('button');button.className='ghost xs';button.type='button';button.textContent=item.name;button.addEventListener('click',function(){select(value,true);});host.appendChild(button);});}
  window.recordForgeRecent=function(){var value=nativeSelect.value;if(!value)return;recent=[value].concat(recent.filter(function(other){return other!==value;})).slice(0,8);save();renderRecent();};
  document.querySelectorAll('#bpList .ab-bp-row').forEach(function(row){var value=row.dataset.forgeValue;if(!value)return;var button=document.createElement('button');button.className='ghost xs ab-bp-forge';button.type='button';button.textContent='Forge';button.addEventListener('click',function(event){event.stopPropagation();select(value,true);});row.appendChild(button);});
  if(nativeSelect.value&&!exists(nativeSelect.value)){nativeSelect.value='';sessionStorage.removeItem('forge_selected_item');}
  renderTabs();render();renderRecent();applyDiscipline();save();
})();
</script>
{{end}}
