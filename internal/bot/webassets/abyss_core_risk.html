{{define "abyssCoreInsurance"}}
<span class="ab-insurance-slider" id="insuranceControls">
  <label for="insurancePct">🛡️ Insure <output id="insurancePctOut">{{if .CoreLoop.Insured}}{{.CoreLoop.Insured}}{{else}}25{{end}}%</output></label>
  <input id="insurancePct" type="range" min="{{.CoreLoop.InsuranceMin}}" max="{{.CoreLoop.InsuranceMax}}" step="{{.CoreLoop.InsuranceStep}}" value="{{if .CoreLoop.Insured}}{{.CoreLoop.Insured}}{{else}}25{{end}}" aria-label="Cache insurance percentage">
  <button class="ghost xs" id="btnInsureSelected" type="button" onclick="abyssInsureSelected()">Buy cover</button>
</span>
{{end}}

{{define "abyssCoreRiskConsole"}}
<details class="ab-risk-console" id="abyssRiskConsole" {{if .Run.Active}}open{{end}}>
  <summary><span>⚖️ Risk protocols</span><span class="ab-risk-summary" id="abyssRiskSummary">Server-authoritative</span></summary>
  <div class="ab-risk-chips" id="abyssRiskChips" aria-live="polite"></div>
  <div class="ab-risk-actions">
    <label class="ab-risk-switch"><input id="bankSafeWordToggle" type="checkbox" {{if .CoreLoop.BankConfirm}}checked{{end}}> Type BANK above 1M</label>
    <label class="ab-risk-switch ab-risk-danger"><input id="deathWishToggle" type="checkbox" {{if .CoreLoop.DeathWish}}checked{{end}}> Death Wish: 3× danger / 2× reward</label>
    <button class="ghost xs" id="anchorRuneBtn" type="button" onclick="abyssBuyAnchorRune()" {{if .CoreLoop.AnchorRune}}disabled{{end}}>⚓ {{if .CoreLoop.AnchorRune}}Anchor armed{{else}}Buy anchor · 🜲20{{end}}</button>
  </div>
</details>
{{end}}

{{define "abyssCoreRiskJS"}}
<script data-cfasync="false">
(function(){
  'use strict';
  var state={{jsonJS .CoreLoop}}||{};

  function chip(icon,label,tone){
    var node=document.createElement('span');node.className='ab-risk-chip '+(tone||'');node.textContent=icon+' '+label;return node;
  }
  function render(){
    var panel=document.getElementById('abyssRiskConsole'),host=document.getElementById('abyssRiskChips'),summary=document.getElementById('abyssRiskSummary');
    if(panel)panel.hidden=!inRun;
    if(!host)return;
    state.greedy_grip_stacks=Math.min(10,Math.floor(Math.max(0,Number(curDepth)||0)/10));
    state.greedy_interest_pct=state.greedy_grip_stacks*2;state.greedy_def_pct=state.greedy_interest_pct;
    state.heavy_pockets_penalty_pct=Math.min(20,Math.max(0,Math.floor((Math.max(0,Number(curEscrow)||0)-100000)/50000)));
    host.replaceChildren();var active=0;
    if(state.greedy_grip_stacks){host.appendChild(chip('✊','Grip ×'+state.greedy_grip_stacks+' · +'+state.greedy_interest_pct+'% interest / −'+state.greedy_def_pct+'% DEF','warn'));active++;}
    if(state.heavy_pockets_penalty_pct){host.appendChild(chip('🎒','Heavy pockets · −'+state.heavy_pockets_penalty_pct+'% SPD','warn'));active++;}
    if(state.idle_danger_pct){host.appendChild(chip('👁️','Noticed · +'+state.idle_danger_pct+'% danger','danger'));active++;}
    if(state.death_wish){host.appendChild(chip('💀','Death Wish armed','danger'));active++;}
    if(state.anchor_rune){host.appendChild(chip('⚓','Half-cache anchor armed','good'));active++;}
    if(state.low_hp){host.appendChild(chip('🫀','Frantic bank fee · −'+state.frantic_fee_pct+'% cache','danger'));active++;}
    if(state.echo_seed){host.appendChild(chip('↩️','Next-run echo '+fmtGold(state.echo_seed),'good'));active++;}
    if(!active)host.appendChild(chip('✓','No active penalties','good'));
    if(summary)summary.textContent=active?active+' active':'Clear';
  }

  window.abyssInsureSelected=function(){var input=document.getElementById('insurancePct');if(input)abyssInsure(Number(input.value));};
  var insurance=document.getElementById('insurancePct'),insuranceOut=document.getElementById('insurancePctOut');
  if(insurance)insurance.addEventListener('input',function(){if(insuranceOut)insuranceOut.value=insurance.value+'%';});

  var safe=document.getElementById('bankSafeWordToggle');
  if(safe)safe.addEventListener('change',async function(){
    var requested=safe.checked,d=await abPost('/api/abyss/bank_confirm_toggle',{on:requested});
    if(!d.ok){safe.checked=!requested;abToast(d.error||'Setting failed',false);return;}
    state.bank_confirm=!!d.on;abToast(d.msg,true);
  });
  var wish=document.getElementById('deathWishToggle');
  if(wish)wish.addEventListener('change',async function(){
    var requested=wish.checked,d=await abPost('/api/abyss/death_wish',{on:requested});
    if(!d.ok){wish.checked=!requested;abToast(d.error||'Death Wish failed',false);return;}
    state.death_wish=!!d.death_wish;render();abToast(d.msg,true);
  });
  window.abyssBuyAnchorRune=async function(){
    if(!(await confirmModal('Spend 20 Abyss Tokens to preserve half the cache on your next death?',{title:'Arm Anchor Rune',okLabel:'Arm rune · 🜲20'})))return;
    var d=await abPost('/api/abyss/anchor_rune');if(!d.ok){abToast(d.error||'Anchor failed',false);return;}
    state.anchor_rune=true;setTokens(d.tokens);var button=document.getElementById('anchorRuneBtn');if(button){button.disabled=true;button.textContent='⚓ Anchor armed';}render();abToast(d.msg,true);
  };
  window.abyssRestCacheShrink=async function(){
    var cache=Math.floor((Number(curEscrow)||0)/2);
    if(!(await confirmModal('Convert '+fmtGold(cache)+' — half the cache — into tokens at 70% of the normal rate? This can be done once on this rest floor.',{title:'Compress cache',okLabel:'Convert half'})))return;
    var d=await abPost('/api/abyss/rest_cache_shrink');if(!d.ok){abToast(d.error||'Conversion failed',false);return;}
    setEscrow(d.escrow);setTokens(d.tokens);state.rest_shrink_ready=false;abToast(d.msg,true);injectRestAction();render();
  };
  function injectRestAction(){
    var options=document.getElementById('ncOptions'),old=document.getElementById('btnRestCacheShrink');if(old)old.remove();
    if(!options||!inRun||floorType!=='rest'||state.rest_shrink_ready===false)return;
    var button=document.createElement('button');button.className='ghost ab-cache-shrink';button.id='btnRestCacheShrink';button.type='button';button.onclick=window.abyssRestCacheShrink;
    button.textContent='🜲 Compress half the cache at 70% rate';options.appendChild(button);
  }
  var lastFloorType=floorType,originalRenderNonCombat=window.renderNonCombat;
  if(typeof originalRenderNonCombat==='function')window.renderNonCombat=function(type,payload){
    if(type==='rest'&&lastFloorType!=='rest')state.rest_shrink_ready=Math.floor((Number(curEscrow)||0)/2)*70/100/100000>=1;
    lastFloorType=type;originalRenderNonCombat(type,payload);injectRestAction();
  };
  var originalSetEscrow=window.setEscrow;
  if(typeof originalSetEscrow==='function')window.setEscrow=function(value){originalSetEscrow(value);render();};
  var originalSetDepth=window.setDepth;
  if(typeof originalSetDepth==='function')window.setDepth=function(value){originalSetDepth(value);render();};

	var downedTimer=0;
	function scheduleDownedDeadline(seconds){
		clearTimeout(downedTimer);
		if(!inRun||!downed)return;
		downedTimer=setTimeout(checkDownedDeadline,Math.max(1,Number(seconds)||1)*1000+150);
	}
	async function checkDownedDeadline(){
		if(!inRun||!downed)return;
		var result=await abPost('/api/abyss/downed_timeout');
		if(!result.ok){scheduleDownedDeadline(15);return;}
		if(result.auto_conceded){
			if(result.gold!==undefined)setGold(result.gold);
			if(result.tokens!==undefined)setTokens(result.tokens);
			abToast(result.msg||'The downed timer expired.',false);
			setTimeout(function(){window.location.reload();},900);return;
		}
		scheduleDownedDeadline(result.remaining_seconds||1);
	}
	document.addEventListener('visibilitychange',function(){if(!document.hidden&&inRun&&downed)checkDownedDeadline();});
  render();injectRestAction();
	scheduleDownedDeadline(state.downed_timeout_seconds||1);
  window.__abyssCoreRisk={render:render,state:state};
})();
</script>
{{end}}
