{{define "abyssSpectate"}}{{template "head" .}}
<link rel="stylesheet" href="{{asset "/static/abyss_live.css"}}"><link rel="stylesheet" href="{{asset "/static/abyss_social.css"}}">
<main class="ab-spectator" data-session="{{.SessionID}}">
  <header><span class="ab-kicker">READ-ONLY LIVE FEED</span><h1>Abyss spectator deck</h1><p>No actions, account IDs, inventory, or private controls are exposed.</p></header>
  <section class="ab-spectator-stage"><div><b id="spectateRound">Connecting…</b><span id="spectatePhase"></span></div><div class="ab-spectator-sides"><div><h2>Allies</h2><div id="spectateAllies"></div></div><div><h2>Enemies</h2><div id="spectateEnemies"></div></div></div><div class="ab-spectator-log" id="spectateLog"></div></section>
</main>
<style>.ab-spectator{max-width:1180px;margin:32px auto;padding:0 18px}.ab-spectator>header{padding:24px;border:1px solid #2c3a4e;border-radius:14px;background:#0d1420}.ab-spectator h1{margin:5px 0}.ab-spectator-stage{margin-top:12px;padding:18px;border:1px solid #2c3a4e;border-radius:14px;background:#090e16}.ab-spectator-stage>div:first-child{display:flex;justify-content:space-between}.ab-spectator-sides{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}.ab-spectator-unit{padding:10px;margin:6px 0;border:1px solid #293750;border-radius:8px}.ab-spectator-unit i{display:block;height:5px;margin-top:7px;border-radius:4px;background:#6bb7ea}.ab-spectator-sides>div:last-child i{background:#dc6675}.ab-spectator-log{max-height:340px;overflow:auto;padding:12px;background:#05080e;font:12px/1.55 ui-monospace,monospace}.ab-spectator-log div{padding:3px 0;border-bottom:1px solid #151d2a}@media(max-width:700px){.ab-spectator-sides{grid-template-columns:1fr}}</style>
<script data-cfasync="false">(function(){var root=document.querySelector('.ab-spectator'),session=root.dataset.session,stopped=false;function unit(host,item){var row=document.createElement('div');row.className='ab-spectator-unit';var label=document.createElement('b');label.textContent=item.name||'Unknown';var hp=document.createElement('span');hp.textContent=' · '+Number(item.hp||0).toLocaleString()+' / '+Number(item.max_hp||0).toLocaleString()+' HP';var bar=document.createElement('i');bar.style.width=(item.max_hp?Math.max(0,Math.min(100,item.hp*100/item.max_hp)):0)+'%';row.append(label,hp,bar);host.appendChild(row);}function render(state){document.getElementById('spectateRound').textContent='Round '+(state.round||0);document.getElementById('spectatePhase').textContent=String(state.phase||'').toUpperCase();['Allies','Enemies'].forEach(function(side){var host=document.getElementById('spectate'+side);host.replaceChildren();(state[side.toLowerCase()]||[]).forEach(function(item){unit(host,item);});});var log=document.getElementById('spectateLog');log.replaceChildren();(state.recent_logs||[]).forEach(function(line){var row=document.createElement('div');row.textContent=line;log.appendChild(row);});if(state.phase==='complete'||state.phase==='failed')stopped=true;}async function poll(){try{var response=await fetch('/api/abyss/spectate?session='+encodeURIComponent(session),{cache:'no-store'}),state=await response.json();if(!state.ok){document.getElementById('spectatePhase').textContent=state.error||'Feed closed';stopped=true;}else render(state);}catch(_){document.getElementById('spectatePhase').textContent='Reconnecting…';}if(!stopped)setTimeout(poll,900);}poll();})();</script>
{{template "foot" .}}{{end}}
