{{define "loot-quickwins"}}
<script data-cfasync="false">
(function(){
  'use strict';var T=ItemTools,manifest=document.getElementById('lootManifest');if(!manifest)return;
  var controls=T.el('div',null,'item-tool-controls'),status=T.select([['','All comparison statuses'],['upgrade','Upgrades'],['tradeoff','Tradeoffs'],['downgrade','Downgrades'],['equivalent','Equivalent'],['unknown','Unknown']]);status.id='lootComparisonFilter';controls.appendChild(T.control('Comparison',status));manifest.before(controls);var counts=T.el('p','','muted small');counts.id='lootComparisonCounts';counts.setAttribute('role','status');controls.after(counts);var updated=T.el('p','','muted small');updated.id='lootComparisonUpdated';updated.setAttribute('aria-live','polite');counts.after(updated);
  var slotOption=T.el('option','Equipment slot');slotOption.value='slot';document.getElementById('lootSort').appendChild(slotOption);
  try{status.value=sessionStorage.getItem('lootComparisonFilter')||'';}catch(_){}status.addEventListener('change',function(){try{sessionStorage.setItem('lootComparisonFilter',status.value);}catch(_){}applyLootFilter();});
  function comparison(row){try{return JSON.parse(row.dataset.comparison||'{}');}catch(_){return {};}}
  window.lootQuickFilter=function(row){return !status.value||(comparison(row).status||'unknown')===status.value;};
  window.lootQuickSnapshot=function(){var state={open:[],status:{},reserved:[],focus:null,scroll:manifest.scrollTop};manifest.querySelectorAll('[data-loot-id]').forEach(function(row){if(row.getAttribute('aria-expanded')==='true')state.open.push(row.dataset.lootId);state.status[row.dataset.lootId]=comparison(row).status;if(row.dataset.equipOnBank==='true')state.reserved.push(row.dataset.lootId);if(row.contains(document.activeElement))state.focus={id:row.dataset.lootId,button:document.activeElement.classList.contains('ab-equip-best')};});return state;};
  window.lootQuickRebuild=function(items,state){var totals={},changes=0;manifest.querySelectorAll('[data-loot-id]').forEach(function(row){var c=comparison(row),kind=c.status||'unknown',id=row.dataset.lootId;totals[kind]=(totals[kind]||0)+1;if(state&&state.status[id]&&state.status[id]!==kind)changes++;var details=row.querySelector('.ab-loot-detail');if(details&&row.dataset.unidentified!=='true'&&row.dataset.itemType==='gear'){var tools=T.mount(details,c);if(tools)tools.addEventListener('click',function(event){event.stopPropagation();});if(!row.querySelector('.loot-copy-comparison')){var copy=T.button('Copy comparison',function(event){event.stopPropagation();T.copy(T.summary(c),details);});copy.classList.add('loot-copy-comparison');details.appendChild(copy);}}
    var item=(items||[]).find(function(i){return String(i.id)===id;});if(details&&item){if(item.best_reason)details.appendChild(T.el('p',item.best_reason));if(item.runner_up_id)details.appendChild(T.el('p','Runner-up: '+(item.runner_up_title||'Drop #'+item.runner_up_id)));var warning=item.reservation_warning||(state&&state.reserved.includes(id)&&!item.can_equip_best?'Your reserved item is no longer the best eligible upgrade. Review it before banking.':'');if(warning)details.appendChild(T.el('p',warning,'item-shortfall'));}
    if(state&&state.open.includes(id)){row.setAttribute('aria-expanded','true');if(details)details.hidden=false;}
  });counts.textContent=Object.keys(totals).map(function(k){return (T.icons[k]||'?')+' '+k+': '+totals[k];}).join(' · ');if(state){updated.textContent='Comparisons updated '+new Date().toLocaleTimeString()+(changes?' · '+changes+' recommendations changed':'');if(changes)T.announce(changes+' item recommendations changed.');manifest.scrollTop=state.scroll;if(state.focus){var row=manifest.querySelector('[data-loot-id="'+CSS.escape(state.focus.id)+'"]');if(row)(state.focus.button?row.querySelector('.ab-equip-best')||row:row).focus({preventScroll:true});}}};
  lootQuickRebuild([],null);applyLootFilter();
})();
</script>
{{end}}
