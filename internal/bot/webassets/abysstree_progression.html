{{define "abysstree-progression"}}
<style>
.tree-progression{margin-top:14px;display:grid;gap:12px}.tree-progression-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}.tree-progression h2,.tree-progression h3{margin:0}.tree-progress-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.tree-progress-card{border:1px solid rgba(137,169,205,.2);border-radius:10px;padding:10px;background:linear-gradient(145deg,rgba(21,31,46,.94),rgba(13,20,32,.94));min-width:0}.tree-progress-card.detected{border-color:rgba(108,229,178,.5);box-shadow:inset 3px 0 #6ce5b2}.tree-progress-card strong{display:flex;justify-content:space-between;gap:8px}.tree-progress-bar{height:5px;background:#172538;border-radius:8px;overflow:hidden;margin:7px 0}.tree-progress-bar i{display:block;height:100%;background:linear-gradient(90deg,#58a6ff,#70e0ad);border-radius:inherit}.tree-mastery-cosmetic{color:#d6b4ff}.tree-recommendations{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}.tree-rec{display:flex;gap:8px;align-items:flex-start;text-align:left}.tree-rec-main{flex:1;min-width:0}.tree-rec-main b,.tree-rec-main small{display:block}.tree-rec-dismiss{border:0;background:transparent;color:#8fa2b8;cursor:pointer;padding:1px 4px}.tree-progress-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tree-progress-controls select{min-height:32px}.tree-achievements{display:flex;gap:6px;flex-wrap:wrap}.tree-achievement{border:1px solid rgba(244,197,66,.24);border-radius:999px;padding:5px 9px;background:rgba(244,197,66,.06)}
</style>
<section class="tree-progression abyss-panel" id="treeProgressionPanel" aria-labelledby="treeProgressionTitle">
  <div class="tree-progression-head">
    <div><h2 id="treeProgressionTitle">🧭 Build identity &amp; progression</h2><p class="muted small">Exact point sources, sector mastery, build signals, and explainable next-node suggestions.</p></div>
    <div class="tree-progress-controls">
      <label class="small" for="treeArchetypePin">Target</label>
      <select id="treeArchetypePin" aria-label="Pinned build archetype"><option value="">Auto-detect</option><option value="glass_cannon">Glass cannon</option><option value="sustain">Sustain</option><option value="control">Control</option><option value="support">Support</option></select>
      <label class="small" for="treeCompletionGoal">Goal</label>
      <select id="treeCompletionGoal" aria-label="Build completion goal"><option value="25">25 nodes</option><option value="50">50 nodes</option><option value="100">100 nodes</option><option value="250">250 nodes</option></select>
      <button type="button" class="ghost xs" id="treeRestoreRecommendations">Restore dismissed</button>
    </div>
  </div>
  <div><h3>Point income</h3><div class="tree-progress-grid" id="treePointSources"></div><p class="muted small" id="treePointCapNote"></p></div>
  <div><h3>Sector mastery</h3><div class="tree-progress-grid" id="treeSectorMastery"></div></div>
  <div><h3>Archetype scores</h3><div class="tree-progress-grid" id="treeArchetypeScores"></div></div>
  <div><h3>Recommended next nodes</h3><div class="tree-recommendations" id="treeRecommendations"></div></div>
  <div><h3>Build goal</h3><div class="tree-progress-card" id="treeGoalProgress"></div></div>
  <div><h3>Tree achievements</h3><div class="tree-achievements" id="treeAchievementProgress"></div></div>
</section>
<script data-cfasync="false">
(function(){
  'use strict';
  var data=TREE_PROGRESSION||{},dismissed={},pin='',goal=25,lastMilestone=0,renderQueued=false;
  var archetypeKeys={
    glass_cannon:['str_pct','crt_pct','skill_damage','physical_skill_power','magic_skill_power','elemental_skill_power','ult_damage','opener_skill_power','low_health_skill_power'],
    sustain:['hp_pct','def_pct','hp_regen','def_to_lifesteal','healing_skill_power','stun_immunity'],
    control:['spd_pct','dge_pct','stun_effectiveness','debuff_duration','defense_penetration','skill_cooldown_recovery','ult_cooldown','ultimate_charge'],
    support:['healing_skill_power','buff_duration','support_party_power','item_skill_power','companion_skill_power','relic_skill_power','pet_damage_pct']
  };
  try{dismissed=JSON.parse(localStorage.getItem('abyssTreeDismissedRecommendations')||'{}')||{};pin=localStorage.getItem('abyssTreePinnedArchetype')||'';goal=Number(localStorage.getItem('abyssTreeCompletionGoal')||25);lastMilestone=Number(localStorage.getItem('abyssTreeCelebratedMilestone')||0);}catch(ignore){}
  function el(tag,className,text){var node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
  function bar(current,target){var wrap=el('div','tree-progress-bar'),fill=el('i');fill.style.width=Math.min(100,target?current/target*100:0)+'%';wrap.appendChild(fill);return wrap;}
  function allocatedIDs(){return Object.keys(alloc).filter(function(id){return alloc[id];}).map(Number);}
  function renderPointSources(){var host=document.getElementById('treePointSources');host.replaceChildren();(data.point_sources||[]).forEach(function(source){var card=el('article','tree-progress-card'),head=el('strong');head.append(el('span','',source.label),el('span','',source.earned+' pt'));card.append(head,bar(source.progress,source.target),el('small','muted',source.next_label+' · +'+source.next_reward+' at '+source.target));host.appendChild(card);});var capped=(data.gross_base||0)>(data.base_point_cap||1000);document.getElementById('treePointCapNote').textContent=(capped?'Base sources are capped at '+data.base_point_cap+' points; ':'')+'Current total: '+points+' points, including Deep Delver mastery.';}
  function masteryFor(sector){var ids=allocatedIDs(),count=ids.filter(function(id){return byId[id]&&byId[id].sector===sector.sector;}).length,next=[10,25,50,100].find(function(value){return count<value;})||100,cosmetic=count>=100?'Animated discipline crown':count>=50?'Discipline aura':count>=25?'Discipline sigil':count>=10?'Discipline trail':'Trail unlocks at 10 nodes';return{count:count,next:next,level:Math.floor(count/10),cosmetic:cosmetic};}
  function renderMastery(){var host=document.getElementById('treeSectorMastery');host.replaceChildren();(data.sectors||[]).forEach(function(sector){var state=masteryFor(sector),card=el('article','tree-progress-card');card.append(el('strong','',sector.name+' · Mastery '+state.level),bar(state.count,state.next),el('small','muted',state.count+' / '+state.next+' allocated'),el('small','tree-mastery-cosmetic','Cosmetic: '+state.cosmetic));host.appendChild(card);});}
  function currentArchetypeScores(){var scores={glass_cannon:0,sustain:0,control:0,support:0};allocatedIDs().forEach(function(id){var node=byId[id];if(!node)return;Object.keys(node.pct||{}).forEach(function(key){Object.keys(archetypeKeys).forEach(function(kind){if(archetypeKeys[kind].indexOf(key)>=0&&node.pct[key]>0)scores[kind]+=node.pct[key]*100;});if(node.pct[key]<0&&['hp_pct','def_pct','dge_pct'].indexOf(key)>=0)scores.glass_cannon-=node.pct[key]*100;});scores.glass_cannon+=(Math.max(0,node.stats.STR||0)/10)+(Math.max(0,node.stats.CRT||0)/5);scores.sustain+=(Math.max(0,node.stats.HP||0)/100)+(Math.max(0,node.stats.DEF||0)/10);scores.control+=Math.max(0,node.stats.SPD||0)/10;scores.support+=(Math.max(0,node.stats.INT||0)/15)+(Math.max(0,node.stats.MNA||0)/100);});return scores;}
  function dominant(scores){return Object.keys(scores).sort(function(a,b){return scores[b]-scores[a];})[0]||'glass_cannon';}
  function archetypeLabel(key){var found=(data.archetypes||[]).find(function(entry){return entry.key===key;});return found?found.label:key.replace('_',' ');}
  function renderArchetypes(){var host=document.getElementById('treeArchetypeScores'),scores=currentArchetypeScores(),total=Object.keys(scores).reduce(function(sum,key){return sum+scores[key];},0),winner=dominant(scores);host.replaceChildren();(data.archetypes||[]).forEach(function(entry){var share=total?Math.round(scores[entry.key]/total*100):0,detected=scores[entry.key]>=10&&share>=20,card=el('article','tree-progress-card'+(detected?' detected':''));card.append(el('strong','',entry.label+(winner===entry.key?' · dominant':'')),bar(share,100),el('small','muted',Math.round(scores[entry.key])+' score · '+share+'% share'),el('small','',entry.description));host.appendChild(card);});}
  function nodeMatches(node,keys){return Object.keys(node.pct||{}).some(function(key){return keys.indexOf(key)>=0&&node.pct[key]>0;});}
  function explanation(node,reason,keys){var effects=Object.keys(node.pct||{}).filter(function(key){return keys.indexOf(key)>=0;}).map(function(key){var effect=(TREE_EFFECTS||[]).find(function(item){return item.key===key;});return effect?effect.label:key.replace(/_/g,' ');});return reason+' It is adjacent, costs '+effCost(node)+' point'+(effCost(node)===1?'':'s')+', and adds '+(effects.join(', ')||node.desc||'useful stats')+'.';}
  function recommendationCandidates(){var scores=currentArchetypeScores(),target=pin||dominant(scores),available=NODES.filter(function(node){return isAllocatable(node.id)&&!dismissed[node.id];}),seen={},out=[];function add(keys,reason,kind){available.filter(function(node){return nodeMatches(node,keys);}).sort(function(a,b){return effCost(a)-effCost(b)||(b.ring-a.ring);}).slice(0,2).forEach(function(node){if(seen[node.id])return;seen[node.id]=true;out.push({node:node,kind:kind,why:explanation(node,reason,keys)});});}add(archetypeKeys[target]||[], 'Supports your '+archetypeLabel(target)+' target.', 'Archetype');add(archetypeKeys.sustain,'Affordable defensive correction for the current path.','Defense');add(archetypeKeys.glass_cannon,'Affordable damage increase for the current path.','Damage');var missing=['loot_find','gold_find','material_yield','skill_mana_cost','consumable_save'].filter(function(key){return !(activePct&&activePct[key]);});add(missing,'Adds a utility effect your allocation does not currently provide.','Missing utility');return out.slice(0,6);}
  function highlightRecommendation(node){var search=document.getElementById('treeSearch');search.value='"'+node.name+'"';treeSearchApply();document.getElementById('treeStage').scrollIntoView({behavior:'smooth',block:'center'});}
  function renderRecommendations(){var host=document.getElementById('treeRecommendations'),items=recommendationCandidates();host.replaceChildren();if(!items.length){host.appendChild(el('p','muted small','No affordable adjacent recommendations remain for this target.'));return;}items.forEach(function(item){var card=el('article','tree-progress-card tree-rec'),main=el('button','ghost tree-rec-main');main.type='button';main.append(el('b','',item.kind+' · '+item.node.name),el('small','',item.why));main.addEventListener('click',function(){highlightRecommendation(item.node);});var close=el('button','tree-rec-dismiss','×');close.type='button';close.title='Dismiss this recommendation';close.setAttribute('aria-label','Dismiss '+item.node.name);close.addEventListener('click',function(){dismissed[item.node.id]=true;localStorage.setItem('abyssTreeDismissedRecommendations',JSON.stringify(dismissed));renderRecommendations();});card.append(main,close);host.appendChild(card);});}
  function renderGoal(){var count=allocatedIDs().length,host=document.getElementById('treeGoalProgress');host.replaceChildren();host.append(el('strong','',count+' / '+goal+' allocated nodes'),bar(count,goal),el('small','muted',count>=goal?'Goal complete — choose a larger target when ready.':(goal-count)+' nodes remain in this build goal.'));}
  function achievementValue(key){var ids=allocatedIDs();if(key==='first_path')return Math.min(ids.length,1);if(key==='web_walker')return Math.min(ids.length,100);if(key==='six_disciplines'){var sectors={};ids.forEach(function(id){if(byId[id])sectors[byId[id].sector]=true;});return Object.keys(sectors).length;}if(key==='keystone_scholar')return Math.min(ids.filter(function(id){return byId[id]&&byId[id].type==='keystone';}).length,10);if(key==='effect_lexicon'){var effects={};ids.forEach(function(id){Object.keys((byId[id]&&byId[id].pct)||{}).forEach(function(key){effects[key]=true;});});return Object.keys(effects).length;}return 0;}
  function renderAchievements(){var host=document.getElementById('treeAchievementProgress');host.replaceChildren();(data.achievements||[]).forEach(function(item){var value=achievementValue(item.key),badge=el('span','tree-achievement',item.label+' '+value+'/'+item.target+(value>=item.target?' ✓':''));host.appendChild(badge);});}
  function celebrate(){var count=allocatedIDs().length,milestone=[10,25,50,100,250].filter(function(value){return count>=value;}).pop()||0;if(milestone>lastMilestone){lastMilestone=milestone;localStorage.setItem('abyssTreeCelebratedMilestone',String(milestone));if(typeof abToast==='function')abToast('🌳 Allocation milestone: '+milestone+' nodes! A new mastery marker is active.',true);}}
  function renderAll(){renderQueued=false;renderMastery();renderArchetypes();renderRecommendations();renderGoal();renderAchievements();celebrate();}
  function scheduleRender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(renderAll);}
  document.getElementById('treeArchetypePin').value=pin;document.getElementById('treeCompletionGoal').value=String(goal);
  document.getElementById('treeArchetypePin').addEventListener('change',function(){pin=this.value;localStorage.setItem('abyssTreePinnedArchetype',pin);renderAll();});
  document.getElementById('treeCompletionGoal').addEventListener('change',function(){goal=Number(this.value)||25;localStorage.setItem('abyssTreeCompletionGoal',String(goal));renderGoal();});
  document.getElementById('treeRestoreRecommendations').addEventListener('click',function(){dismissed={};localStorage.removeItem('abyssTreeDismissedRecommendations');renderRecommendations();});
  var originalPaint=paint;paint=function(){originalPaint.apply(this,arguments);scheduleRender();};
  renderPointSources();renderAll();
})();
</script>
{{end}}
