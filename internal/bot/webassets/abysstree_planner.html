{{define "abysstree-planner"}}
<style>
.tree-plan-panel{margin:8px 0;padding:10px;border:1px solid rgba(178,107,255,.3);border-radius:10px;background:linear-gradient(135deg,rgba(33,20,52,.88),rgba(14,25,43,.88));display:grid;gap:8px}
.tree-plan-actions,.tree-plan-drafts,.tree-plan-counts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.tree-plan-actions button.active{border-color:#b26bff;color:#e3c8ff;background:rgba(178,107,255,.12)}
.tree-plan-drafts input,.tree-plan-drafts select{min-height:34px;border:1px solid rgba(255,255,255,.14);border-radius:7px;background:#121725;color:var(--text);padding:5px 8px}.tree-plan-drafts input{flex:1 1 150px}
.tree-plan-summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:7px}.tree-plan-card{padding:8px;border-radius:7px;background:rgba(0,0,0,.2);font-size:.78rem}.tree-plan-card b{display:block;margin-bottom:4px;color:#d8b7ff}
.tree-plan-warning{color:#ffbd66}.tree-plan-valid{color:#7ee787}.tn.tree-plan-added{stroke:#b26bff!important;stroke-width:4!important;filter:drop-shadow(0 0 8px rgba(178,107,255,.9))!important}.tn.tree-plan-removed{stroke:#ff6b7a!important;stroke-width:4!important;stroke-dasharray:5 3;opacity:.45!important}
.tree-plan-path{color:#c9a7ff}@media print{body *{visibility:hidden}.tree-plan-panel,.tree-plan-panel *{visibility:visible}.tree-plan-panel{position:absolute;inset:0;border:0;background:#fff;color:#111}.tree-plan-actions,.tree-plan-drafts{display:none}}
</style>
<script data-cfasync="false">
(function(){
  'use strict';
  var panel=document.createElement('section');panel.className='tree-plan-panel';panel.setAttribute('aria-label','Skill tree build planner');
  panel.innerHTML='<div class="tree-plan-actions"><button class="ghost xs" id="treePlanToggle" type="button">🧭 Start planning</button><button class="ghost xs" id="treePlanUndo" type="button">↶ Undo</button><button class="ghost xs" id="treePlanRedo" type="button">↷ Redo</button><button class="ghost xs" id="treePlanReset" type="button">Reset to active</button><button class="ghost xs" id="treePlanCommit" type="button">Commit plan</button><button class="ghost xs" id="treePlanExport" type="button">Copy plan code</button><button class="ghost xs" id="treePlanImport" type="button">Preview import</button><button class="ghost xs" id="treePlanPrint" type="button">Print summary</button></div>'+
    '<div class="tree-plan-drafts"><select id="treePlanSlot" aria-label="Server draft slot"><option value="1">Draft 1</option><option value="2">Draft 2</option><option value="3">Draft 3</option><option value="4">Draft 4</option><option value="5">Draft 5</option></select><input id="treePlanName" maxlength="40" placeholder="Draft name" aria-label="Draft name"><button class="ghost xs" id="treePlanSave" type="button">Save server draft</button><button class="ghost xs" id="treePlanLoad" type="button">Load draft</button><button class="ghost xs" id="treePlanDelete" type="button">Delete draft</button></div>'+
    '<div class="tree-plan-counts"><span class="pill">Active <b id="treePlanActiveCount">0</b></span><span class="pill">Planned <b id="treePlanPlannedCount">0</b></span><span class="pill">Added <b id="treePlanAddedCount">0</b></span><span class="pill">Removed <b id="treePlanRemovedCount">0</b></span><span class="pill">Point budget <b id="treePlanCost">—</b></span><span class="pill">Apply <b id="treePlanApplyCost">Checking price…</b></span><span id="treePlanStatus" class="muted small" role="status" aria-live="polite">Planning is off.</span></div>'+
    '<div class="tree-plan-path muted small" id="treePlanPath">Click a node in planning mode to add its cheapest prerequisite path.</div><div class="tree-plan-summary" id="treePlanSummary"></div>';
  var nav=document.querySelector('.tree-nav-panel');nav.parentNode.insertBefore(panel,nav.nextSibling);
  var activeIDs=Object.keys(alloc).filter(function(id){return alloc[id];}).map(Number),planned={},history=[],future=[],planning=false,drafts={},previewTimer=null,lastAnalysis=null,lastPreview=null,previewVersion=0,committing=false,followsActive=true;
  activeIDs.forEach(function(id){planned[id]=true;});
  try{var stored=JSON.parse(localStorage.getItem('abyssTreeDraft')||'null');if(stored&&stored.layout===TREE_CATALOG.layout_hash&&Array.isArray(stored.ids)){followsActive=false;planned={};stored.ids.forEach(function(id){if(byId[id])planned[id]=true;});}}catch(_){}
  function ids(){return Object.keys(planned).filter(function(id){return planned[id];}).map(Number).sort(function(a,b){return a-b;});}
  function snapshot(){return ids();}
  function restore(list){if(committing)return;followsActive=false;planned={};list.forEach(function(id){if(byId[id])planned[id]=true;});persist();renderPlan();schedulePreview();}
  function mutate(fn){if(committing)return;followsActive=false;history.push(snapshot());if(history.length>60)history.shift();future=[];fn();persist();renderPlan();schedulePreview();}
  function persist(){try{localStorage.setItem('abyssTreeDraft',JSON.stringify({v:1,layout:TREE_CATALOG.layout_hash,ids:ids()}));}catch(_){}}
  function cheapestPlanPath(target){if(planned[target])return{chain:[target],cost:0,anchor:target};var dist={},prev={},open=[{id:target,cost:effCost(byId[target])}];dist[target]=effCost(byId[target]);prev[target]=-1;while(open.length){open.sort(function(a,b){return a.cost-b.cost;});var cur=open.shift(),u=cur.id;if(cur.cost!==dist[u])continue;var ns=adj[u]||[];for(var i=0;i<ns.length;i++){var v=ns[i];if(v===0||planned[v]){var chain=[];for(var c=u;c!==-1;c=prev[c])chain.push(c);return{chain:chain,anchor:v,cost:dist[u]};}if(!byId[v])continue;var next=dist[u]+effCost(byId[v]);if(!(v in dist)||next<dist[v]){dist[v]=next;prev[v]=u;open.push({id:v,cost:next});}}}return null;}
  function handlePlanNode(nodeID){if(planned[nodeID]){mutate(function(){delete planned[nodeID];});document.getElementById('treePlanPath').textContent='Removed '+byId[nodeID].name+'. Connectivity will be checked by the server preview.';return;}var path=cheapestPlanPath(nodeID);if(!path){abToast('No path to this node.',false);return;}mutate(function(){path.chain.forEach(function(id){planned[id]=true;});});document.getElementById('treePlanPath').textContent='Cheapest path: '+path.chain.map(function(id){return byId[id].name;}).join(' → ')+' · '+path.cost+' point'+(path.cost===1?'':'s')+' · '+path.chain.length+' prerequisite node'+(path.chain.length===1?'':'s')+'.';}
  window.treePlanner={
    isPlanning:function(){return planning&&activeTab==='passive';},
    has:function(id){return !!planned[id];},
    path:cheapestPlanPath,
    toggle:function(id){if(!committing&&!busy&&byId[id])handlePlanNode(id);},
    remove:function(id){if(!committing&&!busy&&planned[id])handlePlanNode(id);}
  };
  // Guard every passive-tree write, including tooltip and refund shortcuts.
  var basePost=abPost;
  abPost=function(url,body){
    var operation=url.split('/').pop();
    if(treePlanner.isPlanning()&&url.indexOf('/api/abyss/tree/')===0&&
      ['plan_preview','plan_draft','refund_preview','respec_quote'].indexOf(operation)<0&&
      !(operation==='build_import'&&committing)){
      abToast('Planning changes only your draft. Use Commit plan to apply it.',false);
      return Promise.resolve({ok:false,error:'Finish planning before changing the active build.'});
    }
    return basePost(url,body);
  };
  function renderPlan(){
    if(followsActive){planned={};Object.keys(alloc).forEach(function(id){if(alloc[id])planned[id]=true;});}
    activeIDs=Object.keys(alloc).filter(function(id){return alloc[id];}).map(Number);
    var plannedIDs=ids(),activeSet={};activeIDs.forEach(function(id){activeSet[id]=true;});var added=plannedIDs.filter(function(id){return !activeSet[id];}),removed=activeIDs.filter(function(id){return !planned[id];});NODES.forEach(function(node){if(!nodeEls[node.id])return;nodeEls[node.id].classList.toggle('tree-plan-added',planning&&!!planned[node.id]&&!activeSet[node.id]);nodeEls[node.id].classList.toggle('tree-plan-removed',planning&&!planned[node.id]&&!!activeSet[node.id]);});document.getElementById('treePlanActiveCount').textContent=activeIDs.length;document.getElementById('treePlanPlannedCount').textContent=plannedIDs.length;document.getElementById('treePlanAddedCount').textContent=added.length;document.getElementById('treePlanRemovedCount').textContent=removed.length;document.getElementById('treePlanToggle').classList.toggle('active',planning);document.getElementById('treePlanToggle').textContent=planning?'🧭 Planning on':'🧭 Start planning';document.getElementById('treePlanUndo').disabled=!history.length;document.getElementById('treePlanRedo').disabled=!future.length;
    document.getElementById('treePlanToggle').setAttribute('aria-pressed',String(planning));
    var bar=document.getElementById('treePlanBar');if(bar)bar.classList.toggle('planning',planning);
    document.getElementById('treePlanCommit').disabled=committing;
    document.dispatchEvent(new CustomEvent('tree-plan-change'));
  }
  var basePaint=paint;paint=function(){basePaint();renderPlan();};
  function schedulePreview(){
    clearTimeout(previewTimer);previewVersion++;lastAnalysis=null;lastPreview=null;
    document.getElementById('treePlanCost').textContent='Checking…';
    document.getElementById('treePlanApplyCost').textContent='Checking price…';
    document.getElementById('treePlanStatus').textContent=planning?'Draft only · validating changes…':'Inspect nodes freely. Start planning to draft a path.';
    previewTimer=setTimeout(requestPreview,180);
  }
  async function requestPreview(){
    clearTimeout(previewTimer);
    var version=++previewVersion,requested=ids(),key=JSON.stringify(requested);
    lastAnalysis=null;lastPreview=null;
    var response=await abPost('/api/abyss/tree/plan_preview',{ids:requested});
    if(version!==previewVersion||key!==JSON.stringify(ids()))return null;
    if(!response.ok||!response.analysis||!response.quote){
      document.getElementById('treePlanStatus').textContent=response.error||'Preview failed. Retry before applying.';
      document.getElementById('treePlanCost').textContent='Unavailable';
      document.getElementById('treePlanApplyCost').textContent='Unavailable';
      document.getElementById('treePlanSummary').replaceChildren();return null;
    }
    ['ids','added','removed','missing','warnings'].forEach(function(key){if(!Array.isArray(response.analysis[key]))response.analysis[key]=[];});
    lastPreview=response;lastAnalysis=response.analysis;renderAnalysis(lastAnalysis);return response;
  }
  function nonZeroStats(stats){return Object.keys(stats||{}).filter(function(key){return stats[key]!==0;});}
  function renderAnalysis(analysis){document.getElementById('treePlanApplyCost').textContent=treeApplyPrice(lastPreview.quote);document.getElementById('treePlanCost').textContent=analysis.planned_cost+' / '+analysis.available_points;var status=document.getElementById('treePlanStatus');status.className=!planning?'muted small':analysis.valid?'tree-plan-valid small':'tree-plan-warning small';status.textContent=!planning?'Inspect nodes freely. Start planning to draft a path.':analysis.valid?'Draft ready · '+analysis.planned_cost+'/'+analysis.available_points+' points · Apply: '+treeApplyPrice(lastPreview.quote):(analysis.warnings||[]).join(' · ')||'Add a node to begin your draft.';var host=document.getElementById('treePlanSummary');host.replaceChildren();
    function card(title,lines){var box=document.createElement('div');box.className='tree-plan-card';var heading=document.createElement('b');heading.textContent=title;box.appendChild(heading);lines.forEach(function(line){var row=document.createElement('div');row.textContent=line;box.appendChild(row);});host.appendChild(box);}
    card('Changes',['Added: '+analysis.added.length,'Removed: '+analysis.removed.length,'Depth gate: '+analysis.max_depth_gate,'Connected: '+(analysis.connected?'yes':'no')]);var statLines=nonZeroStats(analysis.stat_delta).map(function(key){var value=analysis.stat_delta[key];return key+': '+(value>0?'+':'')+value;});card('Exact stat delta',statLines.length?statLines:['No base-stat change']);var pctLines=Object.keys(analysis.pct_delta||{}).map(function(key){var value=analysis.pct_delta[key]*100;return key+': '+(value>0?'+':'')+value.toFixed(1)+'%';});card('Exact effect delta',pctLines.length?pctLines:['No percentage-effect change']);card('Compatibility',analysis.missing.length?['Missing nodes: '+analysis.missing.join(', ')]:['Layout '+analysis.layout_hash.slice(0,12)+'…','Schema v'+analysis.schema_version]);}
  document.getElementById('treePlanToggle').addEventListener('click',function(){
    if(committing||busy)return;
    planning=!planning;renderPlan();schedulePreview();
  });
  document.getElementById('treePlanUndo').addEventListener('click',function(){if(!history.length)return;future.push(snapshot());restore(history.pop());});document.getElementById('treePlanRedo').addEventListener('click',function(){if(!future.length)return;history.push(snapshot());restore(future.pop());});document.getElementById('treePlanReset').addEventListener('click',function(){mutate(function(){planned={};activeIDs.forEach(function(id){planned[id]=true;});});});
  document.getElementById('treePlanCommit').addEventListener('click',async function(){
    if(committing||busy||!planning)return;
    committing=true;renderPlan();
    try{
      var preview=await requestPreview();
      if(!preview||!preview.analysis.valid){abToast('Resolve plan warnings before committing.',false);return;}
      if(!(await confirmTreeBuild(preview,'Apply this plan?')))return;
      if(lastPreview!==preview){abToast('The draft changed. Review it again before applying.',false);return;}
      await applyConfirmedTreeBuild(preview);
    }finally{committing=false;renderPlan();}
  });
  function encodePlan(){return btoa(JSON.stringify({v:1,schema:TREE_CATALOG.schema_version,layout:TREE_CATALOG.layout_hash,ids:ids()}));}
  function decodePlan(code){var value=JSON.parse(atob(code.trim()));if(value.v!==1||!Array.isArray(value.ids))throw new Error('unsupported plan code');return value;}
  document.getElementById('treePlanExport').addEventListener('click',async function(){var code=encodePlan();try{await navigator.clipboard.writeText(code);abToast('Versioned plan code copied.',true);}catch(_){window.prompt('Copy this plan code:',code);}});
  document.getElementById('treePlanImport').addEventListener('click',function(){var code=window.prompt('Paste a plan code to preview (nothing will be spent):');if(!code)return;try{var value=decodePlan(code);history.push(snapshot());restore(value.ids);planning=true;renderPlan();if(value.layout!==TREE_CATALOG.layout_hash)document.getElementById('treePlanPath').textContent='Imported from another layout version; missing nodes are reported below.';}catch(error){abToast(error.message||'Invalid plan code',false);}});document.getElementById('treePlanPrint').addEventListener('click',function(){window.print();});
  async function refreshDrafts(){var response=await abPost('/api/abyss/tree/plan_draft',{action:'list',slot:0});if(response.ok){drafts=response.drafts||{};var slot=document.getElementById('treePlanSlot').value,draft=drafts[slot];document.getElementById('treePlanName').value=draft?draft.name:'';}}
  document.getElementById('treePlanSlot').addEventListener('change',function(){var draft=drafts[this.value];document.getElementById('treePlanName').value=draft?draft.name:'';});document.getElementById('treePlanSave').addEventListener('click',async function(){var slot=Number(document.getElementById('treePlanSlot').value),response=await abPost('/api/abyss/tree/plan_draft',{action:'save',slot:slot,name:document.getElementById('treePlanName').value,ids:ids()});if(!response.ok){abToast(response.error||'Save failed',false);return;}drafts=response.drafts||{};abToast('Server draft saved.',true);});document.getElementById('treePlanLoad').addEventListener('click',function(){var draft=drafts[document.getElementById('treePlanSlot').value];if(!draft){abToast('That draft slot is empty.',false);return;}history.push(snapshot());restore(draft.ids);planning=true;renderPlan();if(draft.layout_hash!==TREE_CATALOG.layout_hash)document.getElementById('treePlanPath').textContent='This draft was saved on another layout; review compatibility warnings.';});document.getElementById('treePlanDelete').addEventListener('click',async function(){var slot=Number(document.getElementById('treePlanSlot').value),response=await abPost('/api/abyss/tree/plan_draft',{action:'delete',slot:slot});if(response.ok){drafts=response.drafts||{};document.getElementById('treePlanName').value='';abToast('Draft deleted.',true);}});
  renderPlan();schedulePreview();refreshDrafts();
})();
</script>
{{end}}
