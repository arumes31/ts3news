{{define "item-stats-tools"}}
<style>
.item-tools{margin-top:10px;border-top:1px solid var(--border, #354052);padding-top:8px;min-width:0}.item-tools summary{cursor:pointer;font-weight:600}.item-tool-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.item-tool-controls label{display:flex;gap:5px;align-items:center}.item-tool-controls input,.item-tool-controls select,.item-tool-controls button{min-height:44px;max-width:100%;font:inherit}.item-table-wrap{overflow:auto;max-height:420px}.item-stat-table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}.item-stat-table th,.item-stat-table td{padding:6px;text-align:right;white-space:nowrap}.item-stat-table th:first-child,.item-stat-table td:first-child{text-align:left}.item-stat-table thead{position:sticky;top:0;background:var(--surface,#151d2c)}.item-stat-table tr[data-largest]{font-weight:700;background:rgba(130,170,210,.09)}.item-stat-table .loss{color:#ffaaa2}.item-stat-table .gain{color:#81e4b5}.item-tools p{overflow-wrap:anywhere}.item-copy-fallback{width:100%;min-height:120px}.item-status{font-weight:650}.item-shortfall{color:#f0c879}.forge-stat-line{display:flex;justify-content:space-between;gap:6px}.forge-stat-line b{display:inline!important}.forge-stat-line[data-loss="true"]{color:#ffaaa2}.forge-stat-line[hidden]{display:none}.forge-quote-cols{align-items:start}.ab-hovercard,.ab-hovertip{max-width:calc(100vw - 16px)!important;max-height:calc(100dvh - 24px);overflow:auto;overflow-wrap:anywhere}.item-compare-pin{position:sticky;top:8px;z-index:4;background:var(--surface,#151d2c);padding:10px;border:1px solid #506582;border-radius:8px}.item-chip{border-radius:16px;padding:4px 10px}.forge-advanced-disclosure{margin:8px 0}.forge-advanced-disclosure summary{cursor:pointer}.item-tool-status{min-height:1.2em}.item-tools .muted{font-size:.9em}
.forge-plan [hidden]{display:none!important}
@media(max-width:760px){.item-tool-controls>*{min-height:44px}.item-stat-table th,.item-stat-table td{padding:6px 4px}.item-compare-pin{position:static}}
</style>
<script data-cfasync="false">
(function(){
  'use strict';
  var keys=['HP','MNA','STR','DEF','SPD','CRT','DGE','LCK','INT','STA','CHA','STN','SHN','HGR'];
  var icons={upgrade:'▲',tradeoff:'⇄',downgrade:'▼',equivalent:'=',unknown:'?'};
  function el(tag,text,cls){var node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node;}
  function fmt(value,sign){var n=Number(value);if(!Number.isFinite(n))return 'Unavailable';if(n&&Math.abs(n)<1e-12)return (sign&&n>0?'+':'')+n.toPrecision(3);var digits=n&&Math.abs(n)<0.0001?12:Math.abs(n)<1?6:3;return (sign&&n>0?'+':'')+n.toLocaleString(document.documentElement.lang||undefined,{maximumFractionDigits:digits});}
  function num(value,sign){var node=el('span',fmt(value,sign));node.title=String(value);node.setAttribute('aria-label','Exact value '+String(value));node.tabIndex=0;return node;}
  function announce(message){var node=document.getElementById('itemToolsStatus');if(!node){node=el('p','','item-tool-status muted small');node.id='itemToolsStatus';node.setAttribute('role','status');node.setAttribute('aria-live','polite');(document.querySelector('main')||document.body).appendChild(node);}node.textContent=message;}
  async function copy(value,host){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error('unavailable');await navigator.clipboard.writeText(value);announce('Comparison copied.');}catch(_){var area=el('textarea',value,'item-copy-fallback');area.readOnly=true;area.setAttribute('aria-label','Copy this comparison manually');(host||document.querySelector('.modal-content')||document.body).appendChild(area);area.focus();area.select();announce('Select and copy the comparison below.');}}
  function button(label,fn){var b=el('button',label,'ghost xs');b.type='button';b.addEventListener('click',fn);return b;}
  function control(label,node){var l=el('label',label);l.appendChild(node);return l;}
  function select(options){var s=el('select');options.forEach(function(pair){var o=el('option',pair[1]);o.value=pair[0];s.appendChild(o);});return s;}
  function rowsFromItem(item){return item.stat_details||item.stats||[];}
  function compareItems(candidate,current){var a=rowsFromItem(current),b=rowsFromItem(candidate),rows=keys.map(function(code){var old=a.find(function(s){return (s.code||s.label.replace('%',''))===code;}),next=b.find(function(s){return (s.code||s.label.replace('%',''))===code;}),before=Number(old&&old.value||0),after=Number(next&&next.value||0);return {code:code,label:code,before:before,after:after,delta:after-before,combat:keys.indexOf(code)<10,has_percent:before!==0,percent:before?(after-before)/Math.abs(before)*100:0};});return {status:'tradeoff',version:'item-contributions-v2',equipped_name:current.name,all_stats:rows,changes:rows.filter(function(r){return r.delta!==0;}),reasons:['Offer comparison: choose manually after reviewing stats, effects, and price.'],manual_reasons:['Effects and item properties may differ.'],inputs:[current,candidate]};}
  function summary(data){return (icons[data.status]||'?')+' '+(data.status||'unknown')+'\n'+(data.changes||[]).map(function(s){return s.label+' '+fmt(s.before)+' → '+fmt(s.after)+' ('+fmt(s.delta,true)+')';}).join('\n')+(data.xp_bonus_delta?'\nEffective XP bonus '+fmt(data.xp_bonus_delta,true)+' percentage points':'')+(data.regen_delta?'\nRegeneration '+fmt(data.regen_delta,true)+' HP/s':'')+'\n'+(data.reasons||[]).join('\n');}
  function exportDiagnostic(data){var payload={version:data.version||'item-contributions-v2',exported_at:new Date().toISOString(),inputs:data.inputs||[],status:data.status,reasons:data.reasons||[],all_stats:data.all_stats||data.changes||[],xp_delta:data.xp_bonus_delta};var url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));var a=el('a');a.href=url;a.download='item-comparison.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);}
  function mount(host,data){if(!host||host.querySelector(':scope > .item-tools'))return;var box=el('details',null,'item-tools');box.appendChild(el('summary','Detailed comparison · '+(icons[data.status]||'?')+' '+(data.status||'unknown')));var controls=el('div',null,'item-tool-controls');var unchanged=el('input');unchanged.type='checkbox';var flavour=el('input');flavour.type='checkbox';var sort=select([['order','Stat order'],['absolute','Largest absolute change'],['percent','Largest percentage change']]);controls.append(control('Show unchanged',unchanged),control('Show flavour',flavour),control('Order',sort),button('Copy comparison',function(){copy(summary(data),box);}),button('Export diagnostic',function(){exportDiagnostic(data);}));box.appendChild(controls);var wrap=el('div',null,'item-table-wrap');var table=el('table',null,'item-stat-table');table.setAttribute('aria-label','Current and candidate item comparison');var head=el('thead'),tr=el('tr');['Stat','Current','Candidate','Difference','Change %'].forEach(function(title){var th=el('th',title);th.scope='col';tr.appendChild(th);});head.appendChild(tr);var body=el('tbody');table.append(head,body);wrap.appendChild(table);box.appendChild(wrap);
    function render(){var rows=(data.all_stats||data.changes||[]).filter(function(s){return (unchanged.checked||s.delta!==0)&&(flavour.checked||s.combat!==false);}).slice();if(sort.value!=='order')rows.sort(function(a,b){return Math.abs(sort.value==='percent'?b.percent||0:b.delta)-Math.abs(sort.value==='percent'?a.percent||0:a.delta);});var positive=Math.max(0,...rows.map(function(s){return s.delta;})),negative=Math.min(0,...rows.map(function(s){return s.delta;}));body.replaceChildren();rows.forEach(function(s){var row=el('tr');if((s.delta>0&&s.delta===positive)||(s.delta<0&&s.delta===negative))row.dataset.largest='true';var label=el('th',s.label+(s.combat===false?' (flavour)':''));label.scope='row';label.title=s.description||'';row.appendChild(label);[s.before,s.after,s.delta].forEach(function(v,i){var td=el('td',null,i===2?(v<0?'loss':v>0?'gain':''):'');td.appendChild(num(v,i===2));row.appendChild(td);});row.appendChild(el('td',s.has_percent?fmt(s.percent,true)+'%':'—'));body.appendChild(row);});if(!rows.length){var td=el('td','No matching stat changes.');td.colSpan=5;var row=el('tr');row.appendChild(td);body.appendChild(row);}}
    [unchanged,flavour,sort].forEach(function(c){c.addEventListener('change',render);});render();
    if(!data.unknown&&data.regen_before!=null)box.appendChild(el('p','Regeneration: '+fmt(data.regen_before)+' → '+fmt(data.regen_after)+' HP/s. Equipped player gear heals between Abyss fights, capped at maximum HP. Pet gear does not heal the player.'));
    if(data.condition_before!=null||data.condition_after!=null)box.appendChild(el('p','Current durability: '+(data.condition_before==null?'Unavailable':fmt(data.condition_before))+' → '+(data.condition_after==null?'Unavailable':fmt(data.condition_after))));
    var manual=data.manual_reasons||[],numeric=(data.reasons||[]).filter(function(r){return !manual.includes(r);});if(numeric.length){box.appendChild(el('strong','Measured contributions'));numeric.forEach(function(r){box.appendChild(el('p',r));});}if(manual.length){box.appendChild(el('strong','Manual review'));manual.forEach(function(r){box.appendChild(el('p',r));});}host.appendChild(box);return box;
  }
  function inspector(trigger){var item;try{item=JSON.parse(trigger.dataset.itemInspect);}catch(_){return;}var host=document.querySelector('.item-inspector');if(!host)return;var tools=el('section',null,'item-tools');tools.appendChild(el('h3','Stat sources'));var base=item.base_stats||[],bonus=item.broken_in_bonus||[];base.filter(function(s){return s.value||bonus.some(function(b){return b.code===s.code&&b.value;});}).forEach(function(s){var added=bonus.find(function(b){return b.code===s.code;});tools.appendChild(el('p',s.label+': base '+fmt(s.value)+' + broken-in '+fmt(added&&added.value||0)));});if(trigger.dataset.itemDurability!=null)tools.appendChild(el('p','Current durability: '+fmt(trigger.dataset.itemDurability)+' / '+fmt(item.max_durability)));if(item.broken_in_at){var remaining=Date.parse(item.broken_in_at)-Date.now();tools.appendChild(el('p',remaining>0?'Broken-in bonus in '+Math.ceil(remaining/86400000)+' days ('+new Date(item.broken_in_at).toLocaleDateString()+').':'Broken-in bonus active.'));}
    var weights=el('details');weights.appendChild(el('summary','How stat power is calculated'));weights.appendChild(el('p','STR ×1.2 · DEF ×0.9 · HP ×0.3 · SPD ×1.1 · CRT ×1.5 · DGE ×1.3 · LCK ×0.8 · INT ×0.7 · STA ×0.6 · MNA ×0.1. Rarity and flavour attributes are excluded.'));tools.appendChild(weights);tools.appendChild(el('p','INT and effects such as Radiant can add separate character XP benefits; the item XP multiplier shown above describes this item’s direct contribution.'));tools.appendChild(el('p','Regeneration: '+fmt(item.regen_rate||0)+' HP/s. Equipped player gear heals between Abyss fights, capped at maximum HP. Pet gear does not heal the player.'));
    var flavour=host.querySelectorAll('.item-inspector-stats span');var fold=el('details');fold.appendChild(el('summary','Flavour attributes'));flavour.forEach(function(row){if(row.textContent.includes('(flavour)'))fold.appendChild(row);});if(fold.children.length>1)tools.appendChild(fold);
    var source=trigger.closest('[data-inv-id], [data-id], .abyss-side-gear, .armory-item, .inv-card, .gear-cell'),inv=source&&(source.dataset.invId||source.dataset.id);var existing=document.getElementById('forgeItemSelect'),option=existing&&[...existing.options].find(function(o){return item.id&&(o.dataset.gearId||o.dataset.id)===item.id;});var ref=inv&&/^\d+$/.test(inv)?'inv:'+inv:option?option.value:trigger.closest('.abyss-side-gear,.gear-cell')?'equipped:'+item.slot:'';
    if(ref){tools.appendChild(button('Open in forge',function(){sessionStorage.setItem('itemForgeSelection',ref);if(existing){if(typeof closeModal==='function')closeModal();var tab=document.querySelector('.ab-tab[data-tab-key="forge"]');if(tab)tab.click();existing.value=ref;existing.dispatchEvent(new Event('change',{bubbles:true}));}else location.href='/abyss?gear=1&forge=1';}));}
    host.appendChild(tools);
  }
  window.ItemTools={keys:keys,icons:icons,el:el,fmt:fmt,num:num,button:button,select:select,control:control,announce:announce,copy:copy,mount:mount,summary:summary,compareItems:compareItems,exportDiagnostic:exportDiagnostic};
  document.addEventListener('DOMContentLoaded',function(){var original=window.openItemInspector;if(original)window.openItemInspector=function(trigger){original(trigger);inspector(trigger);};});
})();
</script>
{{end}}
