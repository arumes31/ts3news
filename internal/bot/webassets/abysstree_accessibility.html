{{define "abysstree-accessibility"}}
<style>
.tn:focus-visible,.tn.tree-keyboard-focus{outline:none;stroke:#fff!important;stroke-width:6!important;filter:drop-shadow(0 0 9px #fff)!important}.tree-touch-hit{fill:transparent;stroke:transparent;stroke-width:28;pointer-events:stroke}.tree-high-contrast .tree-stage{background:#050505}.tree-high-contrast .tn{stroke-width:4}.tree-high-contrast .tn.on{fill:#fff!important;stroke:#000!important}.tree-high-contrast .tn.can{fill:#000!important;stroke:#fff!important;stroke-dasharray:6 3}.tree-high-contrast .te{opacity:.75}.tree-high-contrast .te.on{stroke:#fff!important;stroke-width:5}.tree-high-contrast .tree-nav-hidden{opacity:.18!important}.tree-reduced-motion *,.tree-no-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}.tree-perf-meter{position:fixed;right:8px;bottom:8px;z-index:1200;padding:5px 8px;border:1px solid #4fca93;border-radius:7px;background:rgba(2,12,17,.92);color:#91f5c6;font:11px/1.4 ui-monospace,monospace}.tree-sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.tree-stage.low-detail .tn-icon,.tree-stage.low-detail .portal-swirl,.tree-stage.low-detail .tree-bg-stars,.tree-stage.low-detail .tree-constellations{display:none!important}.tree-stage.low-detail .tn:focus-visible{display:block!important}.tree-a11y-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
@media(max-width:760px){.tree-toolbar2,.tree-toolbar,.tree-nav-filters,.tree-nav-actions{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}.tree-toolbar2>*,.tree-toolbar>*,.tree-nav-filters>*,.tree-nav-actions>*{min-width:0;width:100%}.tree-a11y-controls{grid-column:1/-1}.tree-tip{max-width:calc(100vw - 16px)}}
@media(pointer:coarse){.tree-toolbar button,.tree-toolbar2 button,.tree-nav-panel button,.tree-progress-controls button,.tree-progress-controls select{min-height:44px;min-width:44px}.tree-tip{position:fixed!important;left:8px!important;right:8px!important;bottom:8px!important;top:auto!important;max-height:46vh;overflow:auto;z-index:1300}}
@media(prefers-reduced-motion:reduce){.tree-stage *{animation:none!important;transition:none!important}}
</style>
<div id="treeMutationLive" class="tree-sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<script data-cfasync="false">
(function(){
  'use strict';
  var root=document.documentElement,stage=document.getElementById('treeStage'),pendingPaint=false,lastBuildKey='',parsedIconGeometry=new Map(),pinch=null,debug=new URL(location.href).searchParams.get('treeDebug')==='1',perfMeter=null,paintSamples=[],visibleDecorations=0;
  var reduceQuery=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)');
  function setClass(name,on){root.classList.toggle(name,!!on);}
  function loadPreference(key){try{return localStorage.getItem(key)==='1';}catch(ignore){return false;}}
  function savePreference(key,value){try{localStorage.setItem(key,value?'1':'0');}catch(ignore){}}
  setClass('tree-high-contrast',loadPreference('abyssTreeHighContrast'));
  setClass('tree-no-motion',loadPreference('abyssTreeNoMotion'));
  function applyReducedMotion(){setClass('tree-reduced-motion',!!(reduceQuery&&reduceQuery.matches));}
  applyReducedMotion();if(reduceQuery){if(reduceQuery.addEventListener)reduceQuery.addEventListener('change',applyReducedMotion);else if(reduceQuery.addListener)reduceQuery.addListener(applyReducedMotion);}

  var controls=document.createElement('span');controls.className='tree-a11y-controls';
  var contrast=document.createElement('button');contrast.type='button';contrast.className='ghost xs';contrast.id='treeContrastToggle';
  var animation=document.createElement('button');animation.type='button';animation.className='ghost xs';animation.id='treeAnimationToggle';
  function labelControls(){contrast.textContent=root.classList.contains('tree-high-contrast')?'◐ Standard contrast':'◑ High contrast';animation.textContent=root.classList.contains('tree-no-motion')?'▶ Enable animation':'⏸ Pause animation';contrast.setAttribute('aria-pressed',root.classList.contains('tree-high-contrast')?'true':'false');animation.setAttribute('aria-pressed',root.classList.contains('tree-no-motion')?'true':'false');}
  contrast.addEventListener('click',function(){var on=!root.classList.contains('tree-high-contrast');setClass('tree-high-contrast',on);savePreference('abyssTreeHighContrast',on);labelControls();});
  animation.addEventListener('click',function(){var on=!root.classList.contains('tree-no-motion');setClass('tree-no-motion',on);savePreference('abyssTreeNoMotion',on);labelControls();});
  controls.append(contrast,animation);document.querySelector('.tree-nav-actions').appendChild(controls);labelControls();

  function nodeStateSummary(node){var state=alloc[node.id]?'allocated':isAllocatable(node.id)?'available':'locked',gate=gateFloor(node),parts=[node.name,node.type,'sector '+(['War','Vitality','Shadow','Arcane','Fortune','Void'][node.sector]||node.sector),effCost(node)+' points',state];if(gate)parts.push('requires depth '+gate);if(node.desc)parts.push(node.desc);return parts.join('. ')+'.';}
  function refreshNodeAccessibility(){NODES.forEach(function(node){var element=nodeEls[node.id];if(!element)return;element.setAttribute('aria-label',nodeStateSummary(node));element.setAttribute('aria-pressed',alloc[node.id]?'true':'false');element.setAttribute('aria-disabled',!alloc[node.id]&&!isAllocatable(node.id)?'true':'false');});}
  var baseToast=abToast;abToast=function(message,ok){document.getElementById('treeMutationLive').textContent=String(message||'');return baseToast.apply(this,arguments);};

  function spatialNeighbor(id,key){var current=byId[id],direction=key==='ArrowLeft'?[-1,0]:key==='ArrowRight'?[1,0]:key==='ArrowUp'?[0,-1]:[0,1],best=null,bestScore=Infinity;if(!current)return null;NODES.forEach(function(node){if(node.id===id)return;var dx=node.x-current.x,dy=node.y-current.y,dot=dx*direction[0]+dy*direction[1];if(dot<=0)return;var cross=Math.abs(dx*direction[1]-dy*direction[0]),score=Math.hypot(dx,dy)+cross*2.2;if(score<bestScore){best=node;bestScore=score;}});return best;}
  svg.addEventListener('keydown',function(event){if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(event.key)<0)return;var id=Number(event.target&&event.target.getAttribute('data-id'));if(!id)return;var next=spatialNeighbor(id,event.key);if(!next)return;event.preventDefault();nodeEls[id].classList.remove('tree-keyboard-focus');nodeEls[next.id].classList.add('tree-keyboard-focus');nodeEls[next.id].focus({preventScroll:true});},true);
  document.addEventListener('keydown',function(event){if(event.key!=='Escape')return;hideTip();var tip=document.getElementById('treeTip');if(tip)tip.style.display='none';document.querySelectorAll('dialog[open]').forEach(function(dialog){dialog.close();});var inspector=document.getElementById('treeInspectorGrid');if(inspector&&document.activeElement&&inspector.contains(document.activeElement))svg.focus();document.getElementById('treeMutationLive').textContent='Inspector and dialogs closed.';},true);

  function installTouchTargets(){if(!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches)||activeTab!=='passive')return;NODES.forEach(function(node){var target=nodeEls[node.id];if(!target||target.parentNode.querySelector('.tree-touch-hit[data-touch-id="'+node.id+'"]'))return;var hit=document.createElementNS(NS,'circle');hit.setAttribute('class','tree-touch-hit');hit.setAttribute('cx',node.x);hit.setAttribute('cy',node.y);hit.setAttribute('r','12');hit.setAttribute('data-touch-id',node.id);hit.setAttribute('data-id',node.id);hit.addEventListener('click',function(event){event.stopPropagation();tryAllocate(node.id);});target.parentNode.insertBefore(hit,target);});}

  function touchDistance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);}
  svg.addEventListener('touchstart',function(event){if(event.touches.length!==2){pinch=null;return;}var rect=svg.getBoundingClientRect(),a=event.touches[0],b=event.touches[1],mx=(a.clientX+b.clientX)/2-rect.left,my=(a.clientY+b.clientY)/2-rect.top;pinch={distance:touchDistance(a,b),view:{x:view.x,y:view.y,w:view.w,h:view.h},worldX:view.x+mx/rect.width*view.w,worldY:view.y+my/rect.height*view.h,mx:mx,my:my};event.preventDefault();},{passive:false});
  svg.addEventListener('touchmove',function(event){if(!pinch||event.touches.length!==2)return;var rect=svg.getBoundingClientRect(),distance=touchDistance(event.touches[0],event.touches[1]),scale=pinch.distance/Math.max(1,distance),width=Math.max(300,Math.min(13000,pinch.view.w*scale)),mx=(event.touches[0].clientX+event.touches[1].clientX)/2-rect.left,my=(event.touches[0].clientY+event.touches[1].clientY)/2-rect.top;view.w=width;view.h=width;view.x=pinch.worldX-mx/rect.width*width;view.y=pinch.worldY-my/rect.height*width;applyView();event.preventDefault();},{passive:false});
  svg.addEventListener('touchend',function(event){if(event.touches.length<2)pinch=null;},{passive:true});

  function geometryFor(svgText){var cached=parsedIconGeometry.get(svgText);if(cached)return cached;var doc=new DOMParser().parseFromString(svgText,'image/svg+xml'),svgElement=doc.documentElement,parts=(svgElement.getAttribute('viewBox')||'0 0 512 512').trim().split(/[ ,]+/),paths=Array.prototype.map.call(svgElement.querySelectorAll('path'),function(path){return path.getAttribute('d')||'';}).filter(Boolean);cached={width:parseFloat(parts[2]||512),height:parseFloat(parts[3]||512),paths:paths};parsedIconGeometry.set(svgText,cached);return cached;}
  appendIconPaths=function(group,svgText,size,x,y,nodeID){var geometry=geometryFor(svgText),scale=size/Math.max(geometry.width,geometry.height),icon=document.createElementNS(NS,'g');icon.setAttribute('class','tn-icon');icon.setAttribute('transform','translate('+x+','+y+') scale('+scale+')');geometry.paths.forEach(function(pathData){var path=document.createElementNS(NS,'path');path.setAttribute('d',pathData);path.setAttribute('fill','currentColor');icon.appendChild(path);});group.appendChild(icon);if(nodeID!==undefined){iconEls[nodeID]=icon;paintDecor(nodeID);}};

  function virtualizeDecorations(){if(activeTab!=='passive')return;var margin=view.w*.12,minX=view.x-margin,maxX=view.x+view.w+margin,minY=view.y-margin,maxY=view.y+view.h+margin;visibleDecorations=0;NODES.forEach(function(node){var visible=node.x>=minX&&node.x<=maxX&&node.y>=minY&&node.y<=maxY&&(!nodeEls[node.id]||nodeEls[node.id].style.display!=='none');if(iconEls[node.id]){iconEls[node.id].style.display=visible?'':'none';if(visible)visibleDecorations++;}if(swirlEls[node.id])swirlEls[node.id].style.display=visible?'':'none';});}
  var baseApplyView=applyView;applyView=function(){baseApplyView.apply(this,arguments);virtualizeDecorations();};

  var baseBuild=build;build=function(){var key=activeTab+':'+TREE_CATALOG.layout_hash+':'+(activeTab==='talents'?JSON.stringify(talentLevels):activeTab==='specializations'?activeSpec:'passive');if(key===lastBuildKey&&svg.childNodes.length){paint();return;}lastBuildKey=key;baseBuild.apply(this,arguments);};
  var basePaint=paint;paint=function(){if(pendingPaint)return;pendingPaint=true;requestAnimationFrame(function(){var started=performance.now();pendingPaint=false;basePaint();refreshNodeAccessibility();installTouchTargets();virtualizeDecorations();var elapsed=performance.now()-started;window.__abyssTreeRenderMS=elapsed;paintSamples.push(elapsed);if(paintSamples.length>60)paintSamples.shift();});};

  if(debug){perfMeter=document.createElement('output');perfMeter.className='tree-perf-meter';perfMeter.id='treePerformanceMeter';perfMeter.setAttribute('aria-label','Tree rendering performance');document.body.appendChild(perfMeter);var frames=0,last=performance.now();function frame(now){frames++;if(now-last>=1000){var average=paintSamples.length?paintSamples.reduce(function(sum,value){return sum+value;},0)/paintSamples.length:0;perfMeter.textContent=frames+' fps · paint '+average.toFixed(1)+' ms · '+visibleDecorations+' decorations · '+parsedIconGeometry.size+' icon geometries';frames=0;last=now;}requestAnimationFrame(frame);}requestAnimationFrame(frame);}
  refreshNodeAccessibility();installTouchTargets();virtualizeDecorations();
})();
</script>
{{end}}
