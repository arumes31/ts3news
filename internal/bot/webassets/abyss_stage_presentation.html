{{define "abyss-stage-presentation"}}
<script data-cfasync="false">
function updatePetCombatFrame(frame){
  var bar=document.getElementById('petBar'),track=document.getElementById('petHPBar'),fill=document.getElementById('petFill'),name=document.getElementById('petName');
  var maximum=Number(frame&&frame.pet_max)||0;
  if(!bar||!track||!fill||!name||maximum<=0)return;
  var health=Math.max(0,Math.min(maximum,Number(frame.pet_hp)||0)),percentage=Math.round(health*100/maximum);
  name.textContent=String(frame.pet_name||'Companion');
  fill.style.width=percentage+'%';
  track.setAttribute('aria-valuemax',String(maximum));
  track.setAttribute('aria-valuenow',String(health));
  track.setAttribute('aria-valuetext',health+' of '+maximum+' HP');
  bar.classList.toggle('is-low',percentage<25);
  bar.style.display='';
}
</script>
{{end}}
