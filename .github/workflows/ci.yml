name: CI

on:
  push:
    branches: [ main, v2_test ]
  pull_request:
    branches: [ main, v2_test ]

# Least-privilege default for all jobs; build-docker overrides with its own
# block to add packages: write (CodeQL: actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  build-go:
    name: Build and Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Abyss balance, targeting, malformed-input, and SSE gates
        run: go test ./internal/bot -run 'TestAbyssBalanceGate|TestAbyssTargetingProperties|FuzzAbyssMalformedActionRequest|TestAbyssSSELoad|TestAbyssContentReferences|TestAbyssDescend100ConcurrentDelvers'

      - name: Abyss skill-tree and forge evidence gates
        run: go test ./internal/bot -run 'TestAbyssSkillTreeImprovementEvidenceGate|TestAbyssForgeImprovementEvidenceGate|TestAbyssForgeQuoteCommitParityForEveryOperation|TestAbyssForgeRollbackCoverageForEveryMultiWriteOperation'

      - name: Race detector (Abyss runtime packages)
        run: go test -race ./internal/bot ./internal/content

      - name: golangci-lint
        uses: golangci/golangci-lint-action@63c23d5020da8f97005b6de340504130bdbe42c7 # v9
        with:
          version: latest

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  abyss-browser-e2e:
    name: Abyss Browser Journey
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Exercise enter, descend, bank, and death
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: abyss-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
