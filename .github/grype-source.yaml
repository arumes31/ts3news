# Revalidated 2026-10-10 for migrate/v4 v4.20.1. These daemon vulnerabilities
# occur only in the expanded
# module graph through migrate/v4 -> postgres.test -> dhui/dktest -> Docker.
# No Docker code is imported by this application's builds or tests. CI asserts
# that before applying these version-specific exceptions. New CVEs still fail.
# These exceptions are source-only: the runtime image scan uses no exceptions.
